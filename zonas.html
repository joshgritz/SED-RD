function initSb() {
  if (!_sb && window.supabase) {
    _sb = window.supabase.createClient(
      'https://ilivjaiexfqpioqrozlf.supabase.co',

<style>
:root{--color-primary:#003087;--color-secondary:#C8102E;--color-accent:#F5A623}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;color:#1e293b;min-height:100vh}
.header{background:linear-gradient(135deg,var(--color-primary),#1a4fa8);color:white;padding:16px;position:sticky;top:0;z-index:100}
.header-top{display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:16px;font-weight:900;margin:6px 0 2px}
.header p{font-size:11px;opacity:0.7}
.wrap{padding:12px;max-width:600px;margin:0 auto}
.card{background:white;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:16px;margin-bottom:12px}
.card-title{font-size:12px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px}

/* ── MUNICIPIO ACCORDION ── */
.muni-accordion{margin-bottom:8px}
.muni-header{display:flex;align-items:center;gap:10px;padding:14px;border:2px solid #e2e8f0;border-radius:14px;cursor:pointer;transition:all .15s;background:white}
.muni-header:active{transform:scale(0.98)}
.muni-header:hover{border-color:var(--color-primary)}
.muni-header.abierto{border-color:var(--color-primary);background:#f8faff;border-bottom-left-radius:0;border-bottom-right-radius:0}
.muni-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.muni-nombre{font-size:15px;font-weight:800;flex:1}
.muni-count{font-size:11px;color:#64748b;font-weight:700}
.muni-arrow{font-size:14px;color:#94a3b8;transition:transform .2s}
.muni-arrow.abierto{transform:rotate(180deg)}
.muni-zonas{display:none;padding:8px 0 0 0}
.muni-zonas.abierta{display:block}
.zona-item{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:4px 0;border:2px solid #f1f5f9;border-radius:10px;cursor:pointer;transition:all .15s}
.zona-item:active{transform:scale(0.98)}
.zona-item:hover{border-color:var(--color-primary);background:#f8faff}
.zona-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.zona-nombre{font-size:13px;font-weight:700;flex:1}
.zona-dir-count{font-size:11px;color:#64748b;font-weight:700}

/* ── TABS ── */
.tabs{display:flex;gap:4px;background:white;border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.tab{flex:1;padding:10px 6px;border:none;border-radius:10px;font-size:10px;font-weight:800;cursor:pointer;background:transparent;color:#64748b;transition:all .2s;font-family:inherit;text-align:center}
.tab.activo{background:var(--color-primary);color:white}
.tab-content{display:none}.tab-content.activo{display:block}

/* ── KPI ── */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:white;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.kpi-num{font-size:22px;font-weight:900;color:var(--color-primary)}.kpi-label{font-size:9px;color:#94a3b8;text-transform:uppercase;font-weight:700}

/* ── DIRIGENTE CARD ── */
.dir-card{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid #e2e8f0;border-radius:12px;margin-bottom:8px;transition:all .15s}
.dir-foto{width:40px;height:40px;border-radius:50%;background:#dcfce7;color:#166534;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;overflow:hidden}
.dir-foto img{width:100%;height:100%;object-fit:cover}
.dir-info{flex:1}.dir-nombre{font-size:13px;font-weight:700}.dir-rol{font-size:10px;color:#64748b}
.dir-comite{font-size:10px;font-weight:800;padding:2px 8px;border-radius:8px;flex-shrink:0}

/* ── MAPA ── */
.mapa-box{width:100%;height:300px;border-radius:14px;background:#e2e8f0;position:relative;overflow:hidden;margin-bottom:12px}
.mapa-box iframe{width:100%;height:100%;border:0}

/* ── DELEGADO ── */
.del-card{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:6px;font-size:12px}
.del-mesa{font-weight:800;color:var(--color-secondary);min-width:50px}
.del-nombre{font-weight:600;flex:1}
.del-estado{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:700}
.del-estado.pend{background:#fef3c7;color:#92400e}

/* ── COMITÉ ZONAL ── */
.cargo-card{display:flex;align-items:center;gap:12px;padding:12px;border:2px solid #e2e8f0;border-radius:12px;margin-bottom:8px;transition:all .15s}
.cargo-card.vacío{border-style:dashed;opacity:0.6}
.cargo-card.presidente{border-color:var(--color-secondary);background:#fef2f2}
.cargo-card.vice{border-color:var(--color-primary);background:#eff6ff}
.cargo-card.secre{border-color:#16a34a;background:#f0fdf4}
.cargo-card.frente{border-color:#7c3aed;background:#faf5ff}
.cargo-num{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0}
.cargo-info{flex:1}.cargo-nombre{font-size:12px;font-weight:800}.cargo-categoria{font-size:9px;color:#64748b;text-transform:uppercase}
.cargo-persona{font-size:11px;color:#1e293b;font-weight:600;margin-top:2px}
.cargo-persona.vacio{color:#94a3b8;font-style:italic}
.cargo-actions{display:flex;gap:4px;flex-shrink:0}
.cargo-btn{width:28px;height:28px;border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s}
.cargo-btn:active{transform:scale(0.9)}
.cargo-btn-edit{background:#dbeafe;color:var(--color-primary)}.cargo-btn-del{background:#fee2e2;color:#dc2626}

.cuota-bar{height:8px;border-radius:4px;background:#e2e8f0;overflow:hidden;margin:6px 0}
.cuota-fill{height:100%;border-radius:4px;transition:width .3s}
.cuota-ok{background:#16a34a}.cuota-warn{background:#f59e0b}.cuota-bad{background:#dc2626}
.cuota-label{font-size:10px;color:#64748b;font-weight:700}
.cuota-val{font-size:10px;font-weight:900}

/* ── BOTONES ── */
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;touch-action:manipulation;font-family:inherit;margin-bottom:8px;transition:all .15s}
.btn:active{transform:scale(0.97)}
.btn-gris{background:#f1f5f9;color:#64748b}

.toast{position:fixed;bottom:20px;left:16px;right:16px;max-width:400px;margin:0 auto;padding:13px 18px;border-radius:14px;font-size:14px;font-weight:700;z-index:9999;text-align:center;display:none}
.toast-ok{background:#16a34a;color:white}.toast-error{background:#dc2626;color:white}.toast-info{background:var(--color-primary);color:white}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <span style="font-size:11px;opacity:0.6">Portal Zonal</span>
    <button style="background:rgba(255,255,255,0.2);color:white;border:none;padding:6px 12px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer" onclick="cerrarSesion()">Salir 🔒</button>
  </div>
  <h1 id="zona-titulo">🏛️ Gestión Zonal</h1>
  <p id="zona-sub"></p>
</div>

<div class="wrap">

<!-- SELECCIÓN: MUNICIPIOS → ZONAS -->
<div id="view-selector">
  <div class="card">
    <div class="card-title">🗺️ Selecciona tu Zona</div>
    <div id="muni-lista"></div>
  </div>
</div>

<!-- DASHBOARD ZONA -->
<div id="view-zona" style="display:none">
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-num" id="kpi-dirigentes">0</div><div class="kpi-label">Dirigentes</div></div>
    <div class="kpi"><div class="kpi-num" id="kpi-comites">0</div><div class="kpi-label">Comité Total</div></div>
    <div class="kpi"><div class="kpi-num" id="kpi-ubicados">0</div><div class="kpi-label">Ubicados</div></div>
  </div>

  <div class="tabs">
    <button class="tab activo" onclick="cambiarTab('comite', event)"><i class="fa-solid fa-sitemap"></i> Comité Zonal</button>
    <button class="tab" onclick="cambiarTab('dirigentes', event)"><i class="fa-solid fa-users"></i> Dirigentes</button>
    <button class="tab" onclick="cambiarTab('mapa', event)"><i class="fa-solid fa-map"></i> Mapa</button>
    <button class="tab" onclick="cambiarTab('delegados', event)"><i class="fa-solid fa-check-to-slot"></i> Delegados</button>
  </div>

  <!-- TAB COMITÉ ZONAL -->
  <div class="tab-content activo" id="tab-comite">
    <div id="comite-cargos"><div style="text-align:center;padding:24px;color:#94a3b8">Cargando comité zonal...</div></div>
  </div>

  <div class="tab-content" id="tab-dirigentes">
    <div id="dir-lista"><div style="text-align:center;padding:24px;color:#94a3b8">Cargando...</div></div>
  </div>

  <div class="tab-content" id="tab-mapa">
    <div class="mapa-box" id="mapa-container">
      <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:13px">Cargando mapa...</div>
    </div>
    <div class="card" style="padding:12px">
      <div class="card-title">📍 Ubicaciones</div>
      <div id="ubicaciones-lista"></div>
    </div>
  </div>

  <div class="tab-content" id="tab-delegados">
    <div class="card" style="background:#eff6ff;border:2px solid #bfdbfe;margin-bottom:12px">
      <div style="font-size:12px;color:#1e40af;font-weight:700">📋 Delegados asignados</div>
      <div style="font-size:11px;color:#64748b;margin-top:4px">Los delegados se asignan después de ganar la plancha.</div>
    </div>
    <div id="del-lista"><div style="text-align:center;padding:24px;color:#94a3b8;font-size:13px">Sin delegados asignados aún</div></div>
  </div>

  <button class="btn btn-gris" onclick="volverSelector()">← Volver a municipios</button>
</div>

</div>

<div id="toast" class="toast"></div>

<script>
let sb = initSb();
if (!sb && window.supabase) {
  sb = window.supabase.createClient('https://ilivjaiexfqpioqrozlf.supabase.co','sb_publishable_eB0cnaHRLh4tjAavfiwIjg_DreuwecW');
}

let sesion = null;
let zonaActual = null;
let dirigentesZona = [];

// ═══════════ CONFIG VARS ═══════════
(function() {
  if (typeof APP_CONFIG === 'undefined' || !APP_CONFIG) return;
  var root = document.documentElement;
  root.style.setProperty('--color-primary', APP_CONFIG.branding.primaryColor);
  root.style.setProperty('--color-secondary', APP_CONFIG.branding.secondaryColor);
  root.style.setProperty('--color-accent', APP_CONFIG.branding.accentColor);
  document.querySelector('meta[name="theme-color"]').content = APP_CONFIG.branding.primaryColor;
})();

const MUNICIPIOS = [
  {
    nombre: 'Mao', tipo: 'Cabecera Provincial', icon: '🏙️', color: '#003087',
    zonas: [
      { id: 'zona_a', nombre: 'Zona A', color: '#003087' },
      { id: 'zona_b', nombre: 'Zona B', color: '#C8102E' },
      { id: 'zona_c', nombre: 'Zona C', color: '#16a34a' },
      { id: 'zona_d', nombre: 'Zona D', color: '#efbc00' },
      { id: 'zona_e', nombre: 'Zona E', color: '#7c3aed' },
      { id: 'zona_f', nombre: 'Zona F', color: '#0ea5e9' }
    ]
  },
  {
    nombre: 'Esperanza', tipo: '2do Municipio', icon: '🌾', color: '#16a34a',
    zonas: [
      { id: 'zona_esp1', nombre: 'Zona 1', color: '#f97316' },
      { id: 'zona_esp2', nombre: 'Zona 2', color: '#ec4899' },
      { id: 'zona_esp3', nombre: 'Zona 3', color: '#14b8a6' }
    ]
  },
  {
    nombre: 'Laguna Salada', tipo: 'Municipio', icon: '💧', color: '#7c3aed',
    zonas: [
      { id: 'zona_ls', nombre: 'Zona Única', color: '#8b5cf6' }
    ]
  },
  {
    nombre: 'Amina', tipo: 'Distrito Municipal', icon: '🌿', color: '#0ea5e9',
    zonas: [
      { id: 'zona_am', nombre: 'Zona Única', color: '#06b6d4' }
    ]
  },
  {
    nombre: 'Guatapanal', tipo: 'Distrito Municipal', icon: '🐄', color: '#f97316',
    zonas: [
      { id: 'zona_gu', nombre: 'Zona Única', color: '#84cc16' }
    ]
  },
  {
    nombre: 'Jaibón', tipo: 'Distrito Municipal', icon: '🌻', color: '#ec4899',
    zonas: [
      { id: 'zona_ja', nombre: 'Zona Única', color: '#f43f5e' }
    ]
  },
  {
    nombre: 'Potrero', tipo: 'Distrito Municipal', icon: '⛰️', color: '#6366f1',
    zonas: [
      { id: 'zona_po', nombre: 'Zona Única', color: '#6366f1' }
    ]
  }
];

const ROL_VER_COMITE = ['PRESIDENTE_ZONAL','SECRETARIO_GENERAL','VICEPRESIDENTE','SUBSECRETARIO_GENERAL','SEC_ORGANIZACION','COORDINADOR'];

function getSesion() {
  const sk = (typeof configLoader !== 'undefined' && configLoader.storageKey) ? configLoader.storageKey('sesion') : 'app_sesion';
  const raw = localStorage.getItem(sk);
  if (!raw) { window.location.href = 'login.html'; return null; }
  try {
    const s = JSON.parse(raw);
    if (s.expires <= Date.now()) { localStorage.removeItem(sk); window.location.href = 'login.html'; return null; }
    return s;
  } catch(e) { localStorage.removeItem(sk); window.location.href = 'login.html'; return null; }
}

window.addEventListener('DOMContentLoaded', async () => {
  sesion = getSesion();
  if (!sesion) return;
  var b = (typeof APP_CONFIG !== 'undefined' && APP_CONFIG) ? APP_CONFIG.branding : {};
  var u = (typeof APP_CONFIG !== 'undefined' && APP_CONFIG) ? APP_CONFIG.ui : {};
  document.getElementById('zona-sub').textContent = (sesion.nombre || b.name || '') + ' · ' + (u.anoElectoral || new Date().getFullYear());
  console.log('Sesión:', JSON.stringify({ rol: sesion.rol, nombre: sesion.nombre, municipio: sesion.municipio, zona: sesion.zona }));
  console.log('SB disponible:', !!sb);
  
  if (sb && sesion.cedula) {
    const { data: miRegistro } = await sb.from('dirigentes').select('cedula, nombre, zona, municipio, activo').eq('cedula', sesion.cedula).maybeSingle();
    console.log('Mi registro en dirigentes:', miRegistro);
  }
  
  await cargarConteos();
  console.log('Conteos cargados');
  renderMunicipios();
});

// ═══════════ CARGAR CONTEOS DE DIRIGENTES ═══════════
async function cargarConteos() {
  if (!sb) { console.error('Supabase client no disponible'); return; }
  try {
    const { data, error } = await sb.from('dirigentes')
      .select('zona, municipio').eq('activo', true);
    if (error) { console.error('Error query dirigentes:', error); return; }
    if (!data) { console.warn('Sin datos de dirigentes'); return; }
    const countMap = {};
    data.forEach(d => {
      const key = (d.zona || '').trim().toLowerCase() + '|' + (d.municipio || '').trim().toLowerCase();
      countMap[key] = (countMap[key] || 0) + 1;
    });
    console.log('CountMap:', countMap);
    MUNICIPIOS.forEach(m => {
      m.zonas.forEach(z => {
        const mapKey = z.nombre.trim().toLowerCase() + '|' + m.nombre.trim().toLowerCase();
        z.dirigentes = countMap[mapKey] || 0;
      });
    });
  } catch(e) { console.error('Excepción cargando conteos:', e); }
}

// ═══════════ RENDER MUNICIPIOS (ACCORDION) ═══════════
function renderMunicipios() {
  const el = document.getElementById('muni-lista');
  el.innerHTML = MUNICIPIOS.map((m, i) => {
    const totalDir = m.zonas.reduce((s, z) => s + (z.dirigentes || 0), 0);
    return `
      <div class="muni-accordion">
        <div class="muni-header" onclick="toggleMuni(${i})" id="muni-h-${i}">
          <div class="muni-icon" style="background:${m.color}20;color:${m.color}">${m.icon}</div>
          <div style="flex:1">
            <div class="muni-nombre">${m.nombre}</div>
            <div style="font-size:10px;color:#64748b">${m.tipo} · ${m.zonas.length} zona${m.zonas.length > 1 ? 's' : ''}</div>
          </div>
          <div class="muni-count">${totalDir} dirigente${totalDir !== 1 ? 's' : ''}</div>
          <div class="muni-arrow" id="muni-a-${i}">▼</div>
        </div>
        <div class="muni-zonas" id="muni-z-${i}">
          ${m.zonas.map(z => `
            <div class="zona-item" onclick="seleccionarZona('${m.nombre}','${z.nombre}')">
              <div class="zona-dot" style="background:${z.color}"></div>
              <div class="zona-nombre">${z.nombre}</div>
              <div class="zona-dir-count">${z.dirigentes || 0} dirigente${(z.dirigentes || 0) !== 1 ? 's' : ''}</div>
            </div>
          `).join('')}
        </div>
      </div>`;
  }).join('');
}

function toggleMuni(i) {
  const zonas = document.getElementById('muni-z-' + i);
  const arrow = document.getElementById('muni-a-' + i);
  const header = document.getElementById('muni-h-' + i);
  const abierto = zonas.classList.contains('abierta');

  // Cerrar todos
  document.querySelectorAll('.muni-zonas').forEach(z => z.classList.remove('abierta'));
  document.querySelectorAll('.muni-arrow').forEach(a => { a.classList.remove('abierto'); a.textContent = '▼'; });
  document.querySelectorAll('.muni-header').forEach(h => h.classList.remove('abierto'));

  if (!abierto) {
    zonas.classList.add('abierta');
    arrow.classList.add('abierto');
    arrow.textContent = '▲';
    header.classList.add('abierto');
  }
}

// ═══════════ SELECCIONAR ZONA ═══════════
async function seleccionarZona(municipio, zonaNombre) {
  zonaActual = { municipio, zona: zonaNombre };

  document.getElementById('view-selector').style.display = 'none';
  document.getElementById('view-zona').style.display = 'block';
  document.getElementById('zona-titulo').textContent = '🏛️ ' + zonaNombre + ' — ' + municipio;

  await Promise.all([cargarDirigentes(), cargarComiteZonal()]);
}

function volverSelector() {
  document.getElementById('view-selector').style.display = 'block';
  document.getElementById('view-zona').style.display = 'none';
  zonaActual = null;
}

// ═══════════ CARGAR DIRIGENTES ═══════════
async function cargarDirigentes() {
  dirigentesZona = [];
  if (!sb || !zonaActual) return;

  try {
    console.log('Buscando dirigentes en:', zonaActual.municipio, '|', zonaActual.zona);
    const { data: dirs, error } = await sb.from('dirigentes')
      .select('cedula, nombre, zona, municipio, sector, latitud, longitud, activo')
      .ilike('zona', zonaActual.zona)
      .ilike('municipio', zonaActual.municipio)
      .eq('activo', true);

    if (error) { console.error('Error query dirigentes:', error); return; }
    console.log('Dirigentes encontrados:', dirs ? dirs.length : 0, dirs);

    dirigentesZona = dirs || [];
    const cedulas = dirigentesZona.map(d => d.cedula);

    // Comité counts
    let comiteMap = {};
    if (cedulas.length > 0) {
      const { data: c } = await sb.from('comite_miembros')
        .select('dirigente_cedula').in('dirigente_cedula', cedulas);
      if (c) c.forEach(x => { comiteMap[x.dirigente_cedula] = (comiteMap[x.dirigente_cedula] || 0) + 1; });
    }

    // Fotos
    let fotosMap = {};
    let fotosRaw = [];
    if (cedulas.length > 0) {
      const { data: f } = await sb.from('padron_maestro')
        .select('cedula, foto_url, foto_base64').in('cedula', cedulas);
      fotosRaw = f || [];
      if (f) f.forEach(x => { fotosMap[x.cedula] = x.foto_url || x.foto_base64; });
    }

    // Roles
    let rolesMap = {};
    if (cedulas.length > 0) {
      const { data: r } = await sb.from('usuarios_sistema')
        .select('cedula, rol').in('cedula', cedulas);
      if (r) r.forEach(x => { rolesMap[x.cedula] = x.rol; });
    }

    dirigentesZona = dirigentesZona.map(d => {
      const padFoto = fotosRaw.find(x=>x.cedula===d.cedula);
      return {
        ...d,
        comite: comiteMap[d.cedula] || 0,
        foto: fotosMap[d.cedula] || null,
        foto_url: padFoto ? (padFoto.foto_url || null) : null,
        rol: rolesMap[d.cedula] || null
      };
    });

    // KPIs
    document.getElementById('kpi-dirigentes').textContent = dirigentesZona.length;
    document.getElementById('kpi-comites').textContent = dirigentesZona.reduce((t, d) => t + d.comite, 0);
    document.getElementById('kpi-ubicados').textContent = dirigentesZona.filter(d => d.latitud && d.longitud).length;

    renderDirigentes();
    renderMapa();
    renderDelegados();
  } catch(e) { console.error(e); }
}

// ═══════════ RENDER DIRIGENTES ═══════════
function renderDirigentes() {
  const el = document.getElementById('dir-lista');
  const verComite = ROL_VER_COMITE.includes(sesion.rol);

  if (dirigentesZona.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:24px;color:#94a3b8">Sin dirigentes en esta zona</div>';
    return;
  }

  el.innerHTML = dirigentesZona.map(d => {
    const ini = (d.nombre || '??').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const fotoId = 'zf-' + d.cedula.replace(/[^0-9]/g,'');
    const fotoHtml = d.foto
      ? `<img id="${fotoId}" data-foto-url="${d.foto_url||''}" data-foto-b64="${(d.foto&&!d.foto_url)?d.foto:''}" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" style="width:100%;height:100%;object-fit:cover">`
      : ini;
    const rolLabel = d.rol ? d.rol.replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, c => c.toUpperCase()) : 'Dirigente';
    const comiteBadge = verComite
      ? '<span class="dir-comite" style="background:#dcfce7;color:#166534">' + d.comite + '/10+</span>'
      : '<span class="dir-comite" style="background:#f1f5f9;color:#94a3b8">' + d.comite + '</span>';

    return `
      <div class="dir-card">
        <div class="dir-foto">${fotoHtml}</div>
        <div class="dir-info">
          <div class="dir-nombre">${d.nombre || '—'}</div>
          <div class="dir-rol">${rolLabel} · ${d.sector || '—'}</div>
        </div>
        ${comiteBadge}
      </div>`;
  }).join('');

  // Resolver fotos async
  if (typeof batchGetFotoUrls === 'function') {
    const rows = dirigentesZona.filter(d=>d.foto).map(d=>({cedula:d.cedula,foto_url:d.foto_url||null,foto_base64:(d.foto&&!d.foto_url)?d.foto:null}));
    batchGetFotoUrls(sb, rows).then(urls => {
      Object.entries(urls).forEach(([ced,url])=>{
        const el=document.getElementById('zf-'+ced.replace(/[^0-9]/g,''));
        if(el&&url)el.src=url;
      });
    });
  }
}
function renderMapa() {
  const el = document.getElementById('mapa-container');
  const ubicaciones = dirigentesZona.filter(d => d.latitud && d.longitud);

  if (ubicaciones.length === 0) {
    el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:13px">Sin ubicaciones registradas</div>';
    document.getElementById('ubicaciones-lista').innerHTML = '';
    return;
  }

  const lat = ubicaciones.reduce((s, d) => s + parseFloat(d.latitud), 0) / ubicaciones.length;
  const lng = ubicaciones.reduce((s, d) => s + parseFloat(d.longitud), 0) / ubicaciones.length;
  const markers = ubicaciones.map(d => '&markers=color:red%7C' + d.latitud + ',' + d.longitud).join('');
  el.innerHTML = '<iframe src="https://maps.google.com/maps?q=' + lat + ',' + lng + '&z=14&output=embed' + markers + '" allowfullscreen></iframe>';

  document.getElementById('ubicaciones-lista').innerHTML = ubicaciones.map(d => `
    <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f1f5f9">
      <span style="font-size:14px">📍</span>
      <div style="flex:1"><div style="font-size:12px;font-weight:700">${d.nombre}</div><div style="font-size:10px;color:#64748b">${d.sector || '—'}</div></div>
      <a href="https://www.google.com/maps?q=${d.latitud},${d.longitud}" target="_blank" style="font-size:10px;color:var(--color-primary);font-weight:700;text-decoration:none">Ver →</a>
    </div>
  `).join('');
}

// ═══════════ RENDER DELEGADOS ═══════════
function renderDelegados() {
  const el = document.getElementById('del-lista');
  if (dirigentesZona.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:16px;color:#94a3b8;font-size:13px">Sin dirigentes para delegar</div>';
    return;
  }
  el.innerHTML = dirigentesZona.slice(0, 10).map(d => `
    <div class="del-card">
      <div class="del-mesa">Mesa —</div>
      <div class="del-nombre">${d.nombre || '—'}</div>
      <div class="del-estado pend">Pendiente</div>
    </div>
  `).join('');
}

function cambiarTab(tab, evt) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('activo'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('activo'));
  if (evt && evt.target) evt.target.closest('.tab').classList.add('activo');
  document.getElementById('tab-' + tab).classList.add('activo');
}

function cerrarSesion() { const sk = (typeof configLoader !== 'undefined' && configLoader.storageKey) ? configLoader.storageKey('sesion') : 'app_sesion'; localStorage.removeItem(sk); window.location.href = 'login.html?from=logout'; }

async function cargarComiteZonal() {
  if (!sb || !zonaActual) return;
  try {
    const { data, error } = await sb.rpc('fn_obtener_comite_zonal', {
      p_municipio: zonaActual.municipio,
      p_zona: zonaActual.zona
    });
    if (error) throw error;
    comiteCargos = data || [];
    renderComiteZonal();
  } catch(e) {
    console.error('Error cargando comité zonal:', e);
    renderComiteZonalLocal();
  }
}

function renderComiteZonalLocal() {
  renderComiteZonal();
}

function renderComiteZonal() {
  const el = document.getElementById('comite-cargos');
  if (!el) return;

  const filled = comiteCargos.filter(c => c.cedula || c.miembro_nombre);
  const total = CARGOS_ZONA.length;
  const mujeres = filled.filter(c => c.sexo === 'F').length;
  const jovenes = filled.filter(c => {
    if (!c.cedula) return false;
    const d = comiteCargos.find(x => x.cedula === c.cedula);
    return d && d.fecha_nacimiento && new Date(d.fecha_nacimiento) >= new Date(Date.now() - 25*365*24*60*60*1000);
  }).length;
  const porcMujeres = filled.length > 0 ? Math.round(mujeres * 100 / filled.length) : 0;
  const porcJovenes = filled.length > 0 ? Math.round(jovenes * 100 / filled.length) : 0;

  let html = `
    <div class="card" style="background:linear-gradient(135deg,#f0fdf4,#dcfce7)">
      <div class="card-title">📊 Estructura del Comité Zonal</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">
        <div style="text-align:center">
          <div style="font-size:22px;font-weight:900;color:var(--color-primary)">${filled.length}/${total}</div>
          <div style="font-size:9px;color:#64748b;text-transform:uppercase;font-weight:700">Ocupados</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:22px;font-weight:900;color:#7c3aed">${mujeres}</div>
          <div style="font-size:9px;color:#64748b;text-transform:uppercase;font-weight:700">Mujeres</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:22px;font-weight:900;color:#16a34a">${jovenes}</div>
          <div style="font-size:9px;color:#64748b;text-transform:uppercase;font-weight:700">Jóvenes</div>
        </div>
      </div>
      <div style="margin-bottom:6px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="cuota-label">Cuota Mujeres (33% mín)</span>
          <span class="cuota-val" style="color:${porcMujeres >= 33 ? '#16a34a' : '#dc2626'}">${porcMujeres}%</span>
        </div>
        <div class="cuota-bar"><div class="cuota-fill ${porcMujeres >= 33 ? 'cuota-ok' : 'cuota-warn'}" style="width:${Math.min(porcMujeres, 100)}%"></div></div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="cuota-label">Cuota Juventud</span>
          <span class="cuota-val" style="color:#16a34a">${porcJovenes}%</span>
        </div>
        <div class="cuota-bar"><div class="cuota-fill cuota-ok" style="width:${Math.min(porcJovenes, 100)}%"></div></div>
      </div>
    </div>`;

  // Agrupar por categoría
  const cats = [
    { key: 'ALTA_DIRECCION', label: 'Alta Dirección', icon: '🏛️' },
    { key: 'SECRETARIA', label: 'Secretarías', icon: '📋' },
    { key: 'FRENTE_SECTORIAL', label: 'Frentes Sectoriales', icon: '👥' }
  ];

  cats.forEach(cat => {
    const cargos = CARGOS_ZONA.filter(c => c.cat === cat.key);
    const ocupados = cargos.filter(c => {
      const gc = comiteCargos.find(x => x.cargo_nombre && x.cargo_nombre.includes(c.nombre.split(' ')[0]));
      return gc && gc.cedula;
    }).length;

    html += `<div class="card">
      <div class="card-title">${cat.icon} ${cat.label} <span style="float:right;color:#16a34a">${ocupados}/${cargos.length}</span></div>`;

    cargos.forEach(c => {
      const gc = comiteCargos.find(x => {
        if (!x.cargo_nombre) return false;
        const clean = x.cargo_nombre.replace(/[()]/g, '').trim();
        return clean === c.nombre || clean.includes(c.nombre.split(' ')[0]);
      });
      const nombre = gc ? (gc.miembro_nombre || gc.cargo_nombre) : null;
      const sexo = gc ? gc.sexo : null;
      const esVacío = !nombre;
      const clase = esVacío ? 'vacío' : (c.id === 1 ? 'presidente' : c.id <= 4 ? 'vice' : c.cat === 'FRENTE_SECTORIAL' ? 'frente' : 'secre');
      const ini = nombre ? nombre.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase() : '?';
      const generoIcon = sexo === 'F' ? '♀' : sexo === 'M' ? '♂' : '';

      html += `
        <div class="cargo-card ${clase}">
          <div class="cargo-num" style="background:${c.color}20;color:${c.color}">${c.id}</div>
          <div class="cargo-info">
            <div class="cargo-nombre">${c.nombre}</div>
            <div class="cargo-persona ${esVacío ? 'vacio' : ''}">${nombre || 'Sin asignar'}</div>
          </div>
          ${generoIcon ? `<span style="font-size:14px;color:${sexo === 'F' ? '#7c3aed' : 'var(--color-primary)'}">${generoIcon}</span>` : ''}
          <div class="cargo-actions">
            <button class="cargo-btn cargo-btn-edit" onclick="editarCargo(${c.id}, '${c.nombre}', '${zonaActual.municipio}', '${zonaActual.zona}')"><i class="fa-solid fa-pen"></i></button>
            ${nombre ? `<button class="cargo-btn cargo-btn-del" onclick="eliminarCargo(${c.id}, '${zonaActual.municipio}', '${zonaActual.zona}')"><i class="fa-solid fa-trash"></i></button>` : ''}
          </div>
        </div>`;
    });

    html += `</div>`;
  });

  el.innerHTML = html;
}

function editarCargo(cargoId, cargoNombre, municipio, zona) {
  const gc = comiteCargos.find(x => {
    if (!x.cargo_nombre) return false;
    const clean = x.cargo_nombre.replace(/[()]/g, '').trim();
    return clean === cargoNombre || clean.includes(cargoNombre.split(' ')[0]);
  });
  const actual = gc ? (gc.miembro_nombre || '') : '';
  const actualCedula = gc ? (gc.cedula || '') : '';
  const actualSexo = gc ? (gc.sexo || '') : '';

  const modal = document.createElement('div');
  modal.id = 'modal-cargo';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:flex-end;justify-content:center';
  modal.innerHTML = `
    <div style="background:white;border-radius:20px 20px 0 0;width:100%;max-width:500px;padding:20px;max-height:80vh;overflow-y:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div>
          <div style="font-size:14px;font-weight:800">${cargoNombre}</div>
          <div style="font-size:11px;color:#64748b">${municipio} · ${zona}</div>
        </div>
        <button onclick="document.getElementById('modal-cargo').remove()" style="background:#f1f5f9;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px">✕</button>
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:11px;font-weight:700;color:#64748b;display:block;margin-bottom:4px">Cédula</label>
        <input id="cargo-cedula" type="text" value="${actualCedula}" style="width:100%;padding:10px;border:2px solid #e2e8f0;border-radius:10px;font-size:13px" placeholder="Opcional">
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:11px;font-weight:700;color:#64748b;display:block;margin-bottom:4px">Nombre completo *</label>
        <input id="cargo-nombre" type="text" value="${actual}" style="width:100%;padding:10px;border:2px solid #e2e8f0;border-radius:10px;font-size:13px" placeholder="Nombre del titular">
      </div>
      <div style="margin-bottom:16px">
        <label style="font-size:11px;font-weight:700;color:#64748b;display:block;margin-bottom:4px">Sexo</label>
        <div style="display:flex;gap:8px">
          <button id="sexo-m" onclick="selectSexo('M')" style="flex:1;padding:10px;border:2px solid ${actualSexo === 'M' ? 'var(--color-primary)' : '#e2e8f0'};border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;background:${actualSexo === 'M' ? '#eff6ff' : 'white'}">♂ Masculino</button>
          <button id="sexo-f" onclick="selectSexo('F')" style="flex:1;padding:10px;border:2px solid ${actualSexo === 'F' ? '#7c3aed' : '#e2e8f0'};border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;background:${actualSexo === 'F' ? '#faf5ff' : 'white'}">♀ Femenino</button>
        </div>
      </div>
      <button onclick="guardarCargo(${cargoId}, '${municipio}', '${zona}')" style="width:100%;padding:13px;background:var(--color-primary);color:white;border:none;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer">Guardar</button>
    </div>`;
  document.body.appendChild(modal);
  window._cargoSexoSel = actualSexo;
}

function selectSexo(s) {
  window._cargoSexoSel = s;
  document.getElementById('sexo-m').style.borderColor = s === 'M' ? 'var(--color-primary)' : '#e2e8f0';
  document.getElementById('sexo-m').style.background = s === 'M' ? '#eff6ff' : 'white';
  document.getElementById('sexo-f').style.borderColor = s === 'F' ? '#7c3aed' : '#e2e8f0';
  document.getElementById('sexo-f').style.background = s === 'F' ? '#faf5ff' : 'white';
}

async function guardarCargo(cargoId, municipio, zona) {
  const cedula = document.getElementById('cargo-cedula').value.trim();
  const nombre = document.getElementById('cargo-nombre').value.trim();
  const sexo = window._cargoSexoSel || null;

  if (!nombre) { toast('Ingresa el nombre', 'error'); return; }

  try {
    const { data, error } = await sb.rpc('fn_guardar_comite_zonal', {
      p_municipio: municipio,
      p_zona: zona,
      p_cargo_id: cargoId,
      p_cedula: cedula || null,
      p_nombre: nombre,
      p_sexo: sexo
    });
    if (error) throw error;
    document.getElementById('modal-cargo').remove();
    toast('Guardado exitosamente', 'ok');
    await cargarComiteZonal();
  } catch(e) {
    console.error(e);
    toast('Error al guardar', 'error');
  }
}

async function eliminarCargo(cargoId, municipio, zona) {
  if (!confirm('¿Eliminar esta persona del cargo?')) return;
  try {
    const { data, error } = await sb.rpc('fn_eliminar_comite_zonal', {
      p_municipio: municipio,
      p_zona: zona,
      p_cargo_id: cargoId
    });
    if (error) throw error;
    toast('Eliminado', 'ok');
    await cargarComiteZonal();
  } catch(e) {
    console.error(e);
    toast('Error al eliminar', 'error');
  }
}

window.eliminarCargo = eliminarCargo;
