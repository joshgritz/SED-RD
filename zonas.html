<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#003087">
<title>Portal Zonal — PRM Valverde</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script>
var _sb = null;
if (window.supabase) {
  _sb = window.supabase.createClient(
    'https://ilivjaiexfqpioqrozlf.supabase.co',
    'sb_publishable_eB0cnaHRLh4tjAavfiwIjg_DreuwecW'
  );
}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;color:#1e293b;min-height:100vh}
.header{background:linear-gradient(135deg,#003087,#1a4fa8);color:white;padding:16px;position:sticky;top:0;z-index:100}
.header-top{display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:16px;font-weight:900;margin:6px 0 2px}
.header p{font-size:11px;opacity:0.7}
.wrap{padding:12px;max-width:600px;margin:0 auto}
.card{background:white;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:16px;margin-bottom:12px}
.card-title{font-size:12px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px}

/* ── MUNICIPIO ACCORDION ── */
.muni-accordion{margin-bottom:8px}
.muni-header{display:flex;align-items:center;gap:10px;padding:14px;border:2px solid #e2e8f0;border-radius:14px;cursor:pointer;transition:all .15s;background:white}
.muni-header:active{transform:scale(0.98)}
.muni-header:hover{border-color:#003087}
.muni-header.abierto{border-color:#003087;background:#f8faff;border-bottom-left-radius:0;border-bottom-right-radius:0}
.muni-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.muni-nombre{font-size:15px;font-weight:800;flex:1}
.muni-count{font-size:11px;color:#64748b;font-weight:700}
.muni-arrow{font-size:14px;color:#94a3b8;transition:transform .2s}
.muni-arrow.abierto{transform:rotate(180deg)}
.muni-zonas{display:none;padding:8px 0 0 0}
.muni-zonas.abierta{display:block}
.zona-item{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:4px 0;border:2px solid #f1f5f9;border-radius:10px;cursor:pointer;transition:all .15s}
.zona-item:active{transform:scale(0.98)}
.zona-item:hover{border-color:#003087;background:#f8faff}
.zona-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.zona-nombre{font-size:13px;font-weight:700;flex:1}
.zona-dir-count{font-size:11px;color:#64748b;font-weight:700}

/* ── TABS ── */
.tabs{display:flex;gap:4px;background:white;border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.tab{flex:1;padding:10px 6px;border:none;border-radius:10px;font-size:10px;font-weight:800;cursor:pointer;background:transparent;color:#64748b;transition:all .2s;font-family:inherit;text-align:center}
.tab.activo{background:#003087;color:white}
.tab-content{display:none}.tab-content.activo{display:block}

/* ── KPI ── */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:white;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.kpi-num{font-size:22px;font-weight:900;color:#003087}.kpi-label{font-size:9px;color:#94a3b8;text-transform:uppercase;font-weight:700}

/* ── DIRIGENTE CARD ── */
.dir-card{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid #e2e8f0;border-radius:12px;margin-bottom:8px;transition:all .15s}
.dir-foto{width:40px;height:40px;border-radius:50%;background:#dcfce7;color:#166534;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;overflow:hidden}
.dir-foto img{width:100%;height:100%;object-fit:cover}
.dir-info{flex:1}.dir-nombre{font-size:13px;font-weight:700}.dir-rol{font-size:10px;color:#64748b}
.dir-comite{font-size:10px;font-weight:800;padding:2px 8px;border-radius:8px;flex-shrink:0}

/* ── MAPA ── */
.mapa-box{width:100%;height:300px;border-radius:14px;background:#e2e8f0;position:relative;overflow:hidden;margin-bottom:12px}
.mapa-box iframe{width:100%;height:100%;border:0}

/* ── DELEGADO ── */
.del-card{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:6px;font-size:12px}
.del-mesa{font-weight:800;color:#C8102E;min-width:50px}
.del-nombre{font-weight:600;flex:1}
.del-estado{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:700}
.del-estado.pend{background:#fef3c7;color:#92400e}

/* ── BOTONES ── */
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;touch-action:manipulation;font-family:inherit;margin-bottom:8px;transition:all .15s}
.btn:active{transform:scale(0.97)}
.btn-gris{background:#f1f5f9;color:#64748b}

.toast{position:fixed;bottom:20px;left:16px;right:16px;max-width:400px;margin:0 auto;padding:13px 18px;border-radius:14px;font-size:14px;font-weight:700;z-index:9999;text-align:center;display:none}
.toast-ok{background:#16a34a;color:white}.toast-error{background:#dc2626;color:white}.toast-info{background:#003087;color:white}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <span style="font-size:11px;opacity:0.6">Portal Zonal</span>
    <button style="background:rgba(255,255,255,0.2);color:white;border:none;padding:6px 12px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer" onclick="cerrarSesion()">Salir 🔒</button>
  </div>
  <h1 id="zona-titulo">🏛️ Gestión Zonal</h1>
  <p id="zona-sub">Valverde · PRM 2026</p>
</div>

<div class="wrap">

<!-- SELECCIÓN: MUNICIPIOS → ZONAS -->
<div id="view-selector">
  <div class="card">
    <div class="card-title">🗺️ Selecciona tu Zona</div>
    <div id="muni-lista"></div>
  </div>
</div>

<!-- DASHBOARD ZONA -->
<div id="view-zona" style="display:none">
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-num" id="kpi-dirigentes">0</div><div class="kpi-label">Dirigentes</div></div>
    <div class="kpi"><div class="kpi-num" id="kpi-comites">0</div><div class="kpi-label">Comité Total</div></div>
    <div class="kpi"><div class="kpi-num" id="kpi-ubicados">0</div><div class="kpi-label">Ubicados</div></div>
  </div>

  <div class="tabs">
    <button class="tab activo" onclick="cambiarTab('dirigentes')"><i class="fa-solid fa-users"></i> Dirigentes</button>
    <button class="tab" onclick="cambiarTab('mapa')"><i class="fa-solid fa-map"></i> Mapa</button>
    <button class="tab" onclick="cambiarTab('delegados')"><i class="fa-solid fa-check-to-slot"></i> Delegados</button>
  </div>

  <div class="tab-content activo" id="tab-dirigentes">
    <div id="dir-lista"><div style="text-align:center;padding:24px;color:#94a3b8">Cargando...</div></div>
  </div>

  <div class="tab-content" id="tab-mapa">
    <div class="mapa-box" id="mapa-container">
      <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:13px">Cargando mapa...</div>
    </div>
    <div class="card" style="padding:12px">
      <div class="card-title">📍 Ubicaciones</div>
      <div id="ubicaciones-lista"></div>
    </div>
  </div>

  <div class="tab-content" id="tab-delegados">
    <div class="card" style="background:#eff6ff;border:2px solid #bfdbfe;margin-bottom:12px">
      <div style="font-size:12px;color:#1e40af;font-weight:700">📋 Delegados asignados</div>
      <div style="font-size:11px;color:#64748b;margin-top:4px">Los delegados se asignan después de ganar la plancha.</div>
    </div>
    <div id="del-lista"><div style="text-align:center;padding:24px;color:#94a3b8;font-size:13px">Sin delegados asignados aún</div></div>
  </div>

  <button class="btn btn-gris" onclick="volverSelector()">← Volver a municipios</button>
</div>

</div>

<div id="toast" class="toast"></div>

<script>
let sb = _sb;
if (!sb && window.supabase) {
  sb = window.supabase.createClient('https://ilivjaiexfqpioqrozlf.supabase.co','sb_publishable_eB0cnaHRLh4tjAavfiwIjg_DreuwecW');
}

let sesion = null;
let zonaActual = null;
let dirigentesZona = [];

const MUNICIPIOS = [
  {
    nombre: 'Mao', tipo: 'Cabecera Provincial', icon: '🏙️', color: '#003087',
    zonas: [
      { id: 'zona_a', nombre: 'Zona A', color: '#003087' },
      { id: 'zona_b', nombre: 'Zona B', color: '#C8102E' },
      { id: 'zona_c', nombre: 'Zona C', color: '#16a34a' },
      { id: 'zona_d', nombre: 'Zona D', color: '#efbc00' },
      { id: 'zona_e', nombre: 'Zona E', color: '#7c3aed' },
      { id: 'zona_f', nombre: 'Zona F', color: '#0ea5e9' }
    ]
  },
  {
    nombre: 'Esperanza', tipo: '2do Municipio', icon: '🌾', color: '#16a34a',
    zonas: [
      { id: 'zona_esp1', nombre: 'Zona 1', color: '#f97316' },
      { id: 'zona_esp2', nombre: 'Zona 2', color: '#ec4899' },
      { id: 'zona_esp3', nombre: 'Zona 3', color: '#14b8a6' }
    ]
  },
  {
    nombre: 'Laguna Salada', tipo: 'Municipio', icon: '💧', color: '#7c3aed',
    zonas: [
      { id: 'zona_ls', nombre: 'Zona Única', color: '#8b5cf6' }
    ]
  },
  {
    nombre: 'Amina', tipo: 'Distrito Municipal', icon: '🌿', color: '#0ea5e9',
    zonas: [
      { id: 'zona_am', nombre: 'Zona Única', color: '#06b6d4' }
    ]
  },
  {
    nombre: 'Guatapanal', tipo: 'Distrito Municipal', icon: '🐄', color: '#f97316',
    zonas: [
      { id: 'zona_gu', nombre: 'Zona Única', color: '#84cc16' }
    ]
  },
  {
    nombre: 'Jaibón', tipo: 'Distrito Municipal', icon: '🌻', color: '#ec4899',
    zonas: [
      { id: 'zona_ja', nombre: 'Zona Única', color: '#f43f5e' }
    ]
  },
  {
    nombre: 'Potrero', tipo: 'Distrito Municipal', icon: '⛰️', color: '#6366f1',
    zonas: [
      { id: 'zona_po', nombre: 'Zona Única', color: '#6366f1' }
    ]
  }
];

const ROL_VER_COMITE = ['PRESIDENTE_ZONAL','SECRETARIO_GENERAL','VICEPRESIDENTE','SUBSECRETARIO_GENERAL','SEC_ORGANIZACION','COORDINADOR'];

function getSesion() {
  const raw = localStorage.getItem('prm_sesion');
  if (!raw) { window.location.href = 'login.html'; return null; }
  try {
    const s = JSON.parse(raw);
    if (s.expires <= Date.now()) { localStorage.removeItem('prm_sesion'); window.location.href = 'login.html'; return null; }
    return s;
  } catch(e) { localStorage.removeItem('prm_sesion'); window.location.href = 'login.html'; return null; }
}

window.addEventListener('DOMContentLoaded', async () => {
  sesion = getSesion();
  if (!sesion) return;
  document.getElementById('zona-sub').textContent = (sesion.nombre || 'PRM') + ' · Valverde 2026';
  await cargarConteos();
  renderMunicipios();
});

// ═══════════ CARGAR CONTEOS DE DIRIGENTES ═══════════
async function cargarConteos() {
  if (!sb) return;
  try {
    const { data } = await sb.from('dirigentes')
      .select('zona, municipio').eq('activo', true);
    if (!data) return;
    const countMap = {};
    data.forEach(d => {
      const key = (d.zona || '') + '|' + (d.municipio || '');
      countMap[key] = (countMap[key] || 0) + 1;
    });
    MUNICIPIOS.forEach(m => {
      m.zonas.forEach(z => {
        z.dirigentes = countMap[z.nombre + '|' + m.nombre] || 0;
      });
    });
  } catch(e) { console.error(e); }
}

// ═══════════ RENDER MUNICIPIOS (ACCORDION) ═══════════
function renderMunicipios() {
  const el = document.getElementById('muni-lista');
  el.innerHTML = MUNICIPIOS.map((m, i) => {
    const totalDir = m.zonas.reduce((s, z) => s + (z.dirigentes || 0), 0);
    return `
      <div class="muni-accordion">
        <div class="muni-header" onclick="toggleMuni(${i})" id="muni-h-${i}">
          <div class="muni-icon" style="background:${m.color}20;color:${m.color}">${m.icon}</div>
          <div style="flex:1">
            <div class="muni-nombre">${m.nombre}</div>
            <div style="font-size:10px;color:#64748b">${m.tipo} · ${m.zonas.length} zona${m.zonas.length > 1 ? 's' : ''}</div>
          </div>
          <div class="muni-count">${totalDir} dirigente${totalDir !== 1 ? 's' : ''}</div>
          <div class="muni-arrow" id="muni-a-${i}">▼</div>
        </div>
        <div class="muni-zonas" id="muni-z-${i}">
          ${m.zonas.map(z => `
            <div class="zona-item" onclick="seleccionarZona('${m.nombre}','${z.nombre}')">
              <div class="zona-dot" style="background:${z.color}"></div>
              <div class="zona-nombre">${z.nombre}</div>
              <div class="zona-dir-count">${z.dirigentes || 0} dirigente${(z.dirigentes || 0) !== 1 ? 's' : ''}</div>
            </div>
          `).join('')}
        </div>
      </div>`;
  }).join('');
}

function toggleMuni(i) {
  const zonas = document.getElementById('muni-z-' + i);
  const arrow = document.getElementById('muni-a-' + i);
  const header = document.getElementById('muni-h-' + i);
  const abierto = zonas.classList.contains('abierta');

  // Cerrar todos
  document.querySelectorAll('.muni-zonas').forEach(z => z.classList.remove('abierta'));
  document.querySelectorAll('.muni-arrow').forEach(a => { a.classList.remove('abierto'); a.textContent = '▼'; });
  document.querySelectorAll('.muni-header').forEach(h => h.classList.remove('abierto'));

  if (!abierto) {
    zonas.classList.add('abierta');
    arrow.classList.add('abierto');
    arrow.textContent = '▲';
    header.classList.add('abierto');
  }
}

// ═══════════ SELECCIONAR ZONA ═══════════
async function seleccionarZona(municipio, zonaNombre) {
  zonaActual = { municipio, zona: zonaNombre };

  document.getElementById('view-selector').style.display = 'none';
  document.getElementById('view-zona').style.display = 'block';
  document.getElementById('zona-titulo').textContent = '🏛️ ' + zonaNombre + ' — ' + municipio;

  await cargarDirigentes();
}

function volverSelector() {
  document.getElementById('view-selector').style.display = 'block';
  document.getElementById('view-zona').style.display = 'none';
  zonaActual = null;
}

// ═══════════ CARGAR DIRIGENTES ═══════════
async function cargarDirigentes() {
  dirigentesZona = [];
  if (!sb || !zonaActual) return;

  try {
    const { data: dirs } = await sb.from('dirigentes')
      .select('cedula, nombre, zona, municipio, sector, latitud, longitud, activo')
      .eq('zona', zonaActual.zona)
      .eq('municipio', zonaActual.municipio)
      .eq('activo', true);

    dirigentesZona = dirs || [];
    const cedulas = dirigentesZona.map(d => d.cedula);

    // Comité counts
    let comiteMap = {};
    if (cedulas.length > 0) {
      const { data: c } = await sb.from('comite_miembros')
        .select('dirigente_cedula').in('dirigente_cedula', cedulas);
      if (c) c.forEach(x => { comiteMap[x.dirigente_cedula] = (comiteMap[x.dirigente_cedula] || 0) + 1; });
    }

    // Fotos
    let fotosMap = {};
    if (cedulas.length > 0) {
      const { data: f } = await sb.from('padron_maestro')
        .select('cedula, foto_base64').in('cedula', cedulas);
      if (f) f.forEach(x => { fotosMap[x.cedula] = x.foto_base64; });
    }

    // Roles
    let rolesMap = {};
    if (cedulas.length > 0) {
      const { data: r } = await sb.from('usuarios_sistema')
        .select('cedula, rol').in('cedula', cedulas);
      if (r) r.forEach(x => { rolesMap[x.cedula] = x.rol; });
    }

    dirigentesZona = dirigentesZona.map(d => ({
      ...d,
      comite: comiteMap[d.cedula] || 0,
      foto: fotosMap[d.cedula] || null,
      rol: rolesMap[d.cedula] || null
    }));

    // KPIs
    document.getElementById('kpi-dirigentes').textContent = dirigentesZona.length;
    document.getElementById('kpi-comites').textContent = dirigentesZona.reduce((t, d) => t + d.comite, 0);
    document.getElementById('kpi-ubicados').textContent = dirigentesZona.filter(d => d.latitud && d.longitud).length;

    renderDirigentes();
    renderMapa();
    renderDelegados();
  } catch(e) { console.error(e); }
}

// ═══════════ RENDER DIRIGENTES ═══════════
function renderDirigentes() {
  const el = document.getElementById('dir-lista');
  const verComite = ROL_VER_COMITE.includes(sesion.rol);

  if (dirigentesZona.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:24px;color:#94a3b8">Sin dirigentes en esta zona</div>';
    return;
  }

  el.innerHTML = dirigentesZona.map(d => {
    const ini = (d.nombre || '??').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const fotoHtml = d.foto
      ? '<img src="data:image/jpeg;base64,' + d.foto + '">'
      : ini;
    const rolLabel = d.rol ? d.rol.replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, c => c.toUpperCase()) : 'Dirigente';
    const comiteBadge = verComite
      ? '<span class="dir-comite" style="background:#dcfce7;color:#166534">' + d.comite + '/10+</span>'
      : '<span class="dir-comite" style="background:#f1f5f9;color:#94a3b8">' + d.comite + '</span>';

    return `
      <div class="dir-card">
        <div class="dir-foto">${fotoHtml}</div>
        <div class="dir-info">
          <div class="dir-nombre">${d.nombre || '—'}</div>
          <div class="dir-rol">${rolLabel} · ${d.sector || '—'}</div>
        </div>
        ${comiteBadge}
      </div>`;
  }).join('');
}

// ═══════════ RENDER MAPA ═══════════
function renderMapa() {
  const el = document.getElementById('mapa-container');
  const ubicaciones = dirigentesZona.filter(d => d.latitud && d.longitud);

  if (ubicaciones.length === 0) {
    el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:13px">Sin ubicaciones registradas</div>';
    document.getElementById('ubicaciones-lista').innerHTML = '';
    return;
  }

  const lat = ubicaciones.reduce((s, d) => s + parseFloat(d.latitud), 0) / ubicaciones.length;
  const lng = ubicaciones.reduce((s, d) => s + parseFloat(d.longitud), 0) / ubicaciones.length;
  const markers = ubicaciones.map(d => '&markers=color:red%7C' + d.latitud + ',' + d.longitud).join('');
  el.innerHTML = '<iframe src="https://maps.google.com/maps?q=' + lat + ',' + lng + '&z=14&output=embed' + markers + '" allowfullscreen></iframe>';

  document.getElementById('ubicaciones-lista').innerHTML = ubicaciones.map(d => `
    <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f1f5f9">
      <span style="font-size:14px">📍</span>
      <div style="flex:1"><div style="font-size:12px;font-weight:700">${d.nombre}</div><div style="font-size:10px;color:#64748b">${d.sector || '—'}</div></div>
      <a href="https://www.google.com/maps?q=${d.latitud},${d.longitud}" target="_blank" style="font-size:10px;color:#003087;font-weight:700;text-decoration:none">Ver →</a>
    </div>
  `).join('');
}

// ═══════════ RENDER DELEGADOS ═══════════
function renderDelegados() {
  const el = document.getElementById('del-lista');
  if (dirigentesZona.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:16px;color:#94a3b8;font-size:13px">Sin dirigentes para delegar</div>';
    return;
  }
  el.innerHTML = dirigentesZona.slice(0, 10).map(d => `
    <div class="del-card">
      <div class="del-mesa">Mesa —</div>
      <div class="del-nombre">${d.nombre || '—'}</div>
      <div class="del-estado pend">Pendiente</div>
    </div>
  `).join('');
}

// ═══════════ TABS ═══════════
function cambiarTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('activo'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('activo'));
  event.target.closest('.tab').classList.add('activo');
  document.getElementById('tab-' + tab).classList.add('activo');
}

function cerrarSesion() { localStorage.removeItem('prm_sesion'); window.location.href = 'login.html'; }
let _tt;
