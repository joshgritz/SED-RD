<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5"/>
      <stop offset="50%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
  </defs>
  
  <!-- Círculo exterior tricolor -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#1e88e5" stroke-width="4"/>
  <path d="M100,5 A95,95 0 0,1 182,52" fill="none" stroke="#e53935" stroke-width="4" stroke-linecap="round"/>
  <path d="M182,52 A95,95 0 0,1 182,148" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <path d="M182,148 A95,95 0 0,1 100,195" fill="none" stroke="#1e88e5" stroke-width="4" stroke-linecap="round"/>
  <path d="M100,195 A95,95 0 0,1 18,148" fill="none" stroke="#e53935" stroke-width="4" stroke-linecap="round"/>
  <path d="M18,148 A95,95 0 0,1 18,52" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <path d="M18,52 A95,95 0 0,1 100,5" fill="none" stroke="#1e88e5" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Urna -->
  <g transform="translate(100,90)">
    <!-- Sombra -->
    <ellipse cx="0" cy="50" rx="38" ry="5" fill="black" opacity="0.15"/>
    
    <!-- Cuerpo -->
    <rect x="-35" y="-10" width="70" height="55" rx="4" fill="#f8f8f8" stroke="#ddd" stroke-width="1"/>
    
    <!-- Borde superior -->
    <rect x="-40" y="-18" width="80" height="10" rx="3" fill="#f8f8f8" stroke="#ddd" stroke-width="1"/>
    
    <!-- Ranura -->
    <rect x="-22" y="-15" width="44" height="5" rx="2.5" fill="#333"/>
    
    <!-- Documento -->
    <g transform="rotate(-12, 0, -28)">
      <rect x="-12" y="-50" width="24" height="32" rx="2" fill="white" stroke="#ddd" stroke-width="1"/>
      <line x1="-7" y1="-42" x2="7" y2="-42" stroke="#e0e0e0" stroke-width="1.5"/>
      <line x1="-7" y1="-35" x2="7" y2="-35" stroke="#e0e0e0" stroke-width="1.5"/>
      <line x1="-7" y1="-28" x2="3" y2="-28" stroke="#e0e0e0" stroke-width="1.5"/>
    </g>
    
    <!-- Check -->
    <path d="M-12,8 L-2,20 L16,-5" fill="none" stroke="#1e88e5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Texto -->
  <text x="100" y="170" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="15" fill="#333" letter-spacing="2">SISTEPARD</text>
</svg>
