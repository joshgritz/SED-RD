<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#1b2838"/>
    </linearGradient>
    
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5"/>
      <stop offset="50%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
    
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.4"/>
    </filter>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="400" height="400" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Círculo exterior con glow animado -->
  <circle cx="200" cy="175" r="130" fill="none" stroke-width="6" filter="url(#glow)">
    <animate attributeName="stroke" values="#1e88e5;#e53935;white;#1e88e5" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Segmentos de color animados -->
  <g transform="translate(200,175)">
    <circle r="130" fill="none" stroke="#1e88e5" stroke-width="6" stroke-dasharray="68,746" stroke-dashoffset="0" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="130" fill="none" stroke="#e53935" stroke-width="6" stroke-dasharray="68,746" stroke-dashoffset="-248" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="130" fill="none" stroke="white" stroke-width="6" stroke-dasharray="68,746" stroke-dashoffset="-496" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Urna 3D -->
  <g transform="translate(200,175)" filter="url(#shadow)">
    <!-- Sombra -->
    <ellipse cx="0" cy="65" rx="55" ry="8" fill="black" opacity="0.3">
      <animate attributeName="rx" values="55;50;55" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Flotación -->
    <animateTransform attributeName="transform" type="translate" values="200,175;200,170;200,175" dur="3s" repeatCount="indefinite"/>
    
    <!-- Lateral derecho (3D) -->
    <path d="M50,-20 L70,-30 L70,45 L50,55 Z" fill="#e0e0e0" stroke="#ccc" stroke-width="1"/>
    
    <!-- Superficie superior (3D) -->
    <path d="M-50,-20 L-30,-30 L70,-30 L50,-20 Z" fill="#f8f8f8" stroke="#ccc" stroke-width="1"/>
    
    <!-- Frente -->
    <rect x="-50" y="-20" width="100" height="75" rx="4" fill="white" stroke="#ddd" stroke-width="1"/>
    
    <!-- Borde superior -->
    <rect x="-55" y="-28" width="110" height="12" rx="3" fill="white" stroke="#ddd" stroke-width="1"/>
    
    <!-- Ranura -->
    <rect x="-30" y="-25" width="60" height="6" rx="3" fill="#0d1b2a"/>
    
    <!-- Documento animado -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,15;0,0" dur="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="-12,0,-35;-5,0,-35;-12,0,-35" dur="4s" repeatCount="indefinite" additive="sum"/>
      
      <rect x="-15" y="-65" width="30" height="40" rx="2" fill="white" stroke="#ddd" stroke-width="1"/>
      <line x1="-8" y1="-55" x2="8" y2="-55" stroke="#e0e0e0" stroke-width="1.5"/>
      <line x1="-8" y1="-48" x2="8" y2="-48" stroke="#e0e0e0" stroke-width="1.5"/>
      <line x1="-8" y1="-41" x2="3" y2="-41" stroke="#e0e0e0" stroke-width="1.5"/>
    </g>
    
    <!-- Check mark con pulso -->
    <path d="M-15,10 L-5,22 L20,-5" fill="none" stroke="url(#checkGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-width" values="4;5;4" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Texto SISTEPARD -->
  <text x="200" y="310" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="42" fill="white" letter-spacing="6">SISTEPARD</text>
  
  <!-- Línea tricolor -->
  <line x1="80" y1="330" x2="160" y2="330" stroke="#1e88e5" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="330" x2="230" y2="330" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="330" x2="320" y2="330" stroke="#e53935" stroke-width="3" stroke-linecap="round"/>
  
  <text x="200" y="355" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="300" font-size="13" fill="#90CAF9" letter-spacing="5">SISTEMA ELECTORAL DIGITAL</text>
</svg>
