<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
    
    <linearGradient id="blueMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="30%" style="stop-color:#1976D2"/>
      <stop offset="70%" style="stop-color:#1565C0"/>
      <stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
    
    <linearGradient id="blueLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="50%" style="stop-color:#42A5F5"/>
      <stop offset="100%" style="stop-color:#1976D2"/>
    </linearGradient>
    
    <linearGradient id="redMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF5350"/>
      <stop offset="50%" style="stop-color:#E53935"/>
      <stop offset="100%" style="stop-color:#C62828"/>
    </linearGradient>
    
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E0E0E0"/>
    </linearGradient>
    
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F"/>
      <stop offset="50%" style="stop-color:#FFC107"/>
      <stop offset="100%" style="stop-color:#FF8F00"/>
    </linearGradient>
    
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:white;stop-opacity:0"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow3d">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="20"/>
  
  <!-- Anillos orbitales -->
  <g transform="translate(200,175)">
    <ellipse cx="0" cy="0" rx="140" ry="35" fill="none" stroke="#1976D2" stroke-width="1" opacity="0.3" transform="rotate(-30)">
      <animateTransform attributeName="transform" type="rotate" from="-30 0 0" to="330 0 0" dur="20s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="140" ry="35" fill="none" stroke="#E53935" stroke-width="1" opacity="0.3" transform="rotate(30)">
      <animateTransform attributeName="transform" type="rotate" from="30 0 0" to="-330 0 0" dur="15s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Círculo exterior -->
  <circle cx="200" cy="175" r="130" fill="none" stroke-width="4" opacity="0.8">
    <animate attributeName="stroke" values="#1976D2;#E53935;white;#1976D2" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Puntos de luz -->
  <g transform="translate(200,175)">
    <circle r="5" fill="#2196F3" filter="url(#glow)">
      <animateMotion dur="8s" repeatCount="indefinite">
        <mpath href="#orbit1"/>
      </animateMotion>
    </circle>
    <circle r="5" fill="#E53935" filter="url(#glow)">
      <animateMotion dur="6s" repeatCount="indefinite">
        <mpath href="#orbit2"/>
      </animateMotion>
    </circle>
  </g>
  
  <path id="orbit1" d="M200,175 m-110,0 a110,28 0 1,1 220,0 a110,28 0 1,1 -220,0" fill="none"/>
  <path id="orbit2" d="M200,175 m-90,0 a90,22 0 1,0 180,0 a90,22 0 1,0 -180,0" fill="none"/>
  
  <!-- Urna 3D del v2 con animación -->
  <g transform="translate(200,175)" filter="url(#shadow3d)">
    <animateTransform attributeName="transform" type="translate" values="200,175;200,170;200,175" dur="3s" repeatCount="indefinite"/>
    
    <!-- Sombra -->
    <ellipse cx="0" cy="75" rx="80" ry="12" fill="black" opacity="0.4">
      <animate attributeName="rx" values="80;75;80" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Cuerpo de la urna -->
    <path d="M-65,-45 L65,-45 L75,-35 L75,55 L-75,55 L-75,-35 Z" fill="url(#blueMetal)"/>
    
    <!-- Lateral derecho -->
    <path d="M65,-45 L90,-60 L90,40 L75,55 Z" fill="#0D47A1"/>
    
    <!-- Superficie superior -->
    <path d="M-65,-45 L-40,-60 L90,-60 L65,-45 Z" fill="url(#blueLight)"/>
    
    <!-- Reflejos metálicos -->
    <path d="M-65,-45 L-55,-55 L-50,-55 L-60,-45 Z" fill="url(#shine)" opacity="0.9"/>
    <path d="M-40,-45 L-30,-55 L-20,-55 L-30,-45 Z" fill="url(#shine)" opacity="0.5"/>
    
    <!-- Ranura -->
    <rect x="-45" y="-63" width="90" height="7" rx="3.5" fill="#041a33"/>
    <rect x="-43" y="-62" width="86" height="4" rx="2" fill="#0a2a4d"/>
    
    <!-- Líneas decorativas -->
    <line x1="-55" y1="-25" x2="55" y2="-25" stroke="#42A5F5" stroke-width="1" opacity="0.4"/>
    <line x1="-55" y1="5" x2="55" y2="5" stroke="#42A5F5" stroke-width="1" opacity="0.4"/>
    <line x1="-55" y1="35" x2="55" y2="35" stroke="#42A5F5" stroke-width="1" opacity="0.4"/>
    
    <!-- Papel de voto del v2 con animación -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-25,0,-65;-15,0,-65;-25,0,-65" dur="4s" repeatCount="indefinite"/>
      
      <!-- Sombra del papel -->
      <rect x="-18" y="-110" width="45" height="65" rx="3" fill="black" opacity="0.25" transform="translate(4,4)"/>
      
      <!-- Papel -->
      <rect x="-18" y="-110" width="45" height="65" rx="3" fill="white" stroke="#ddd" stroke-width="1"/>
      
      <!-- Líneas del papel -->
      <line x1="-10" y1="-95" x2="15" y2="-95" stroke="#e0e0e0" stroke-width="1.5"/>
      <line x1="-10" y1="-85" x2="15" y2="-85" stroke="#e0e0e0" stroke-width="1.5"/>
      <line x1="-10" y1="-75" x2="8" y2="-75" stroke="#e0e0e0" stroke-width="1.5"/>
      
      <!-- Check mark del v2 -->
      <path d="M-6,-100 L0,-93 L10,-105" fill="none" stroke="url(#checkGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
        <animate attributeName="stroke-width" values="4;5;4" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- Brillo superior -->
    <path d="M-55,-40 L-45,-50 L55,-50 L65,-40 Z" fill="white" opacity="0.2"/>
  </g>
  
  <!-- Texto -->
  <g transform="translate(200,310)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="200" font-size="38" fill="white" letter-spacing="10" filter="url(#glow)">SISTEPARD</text>
    
    <line x1="-100" y1="18" x2="100" y2="18" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="x1" values="-100;-80;-100" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100;80;100" dur="3s" repeatCount="indefinite"/>
    </line>
    
    <text x="0" y="42" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="12" fill="#90CAF9" letter-spacing="4" opacity="0.8">SISTEMA ELECTORAL DIGITAL</text>
  </g>
  
  <!-- Estrellas -->
  <g opacity="0.6">
    <circle cx="50" cy="50" r="2" fill="#FFD54F">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="50" r="2" fill="#FFD54F">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="350" r="2" fill="#FFD54F">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="350" r="2" fill="#FFD54F">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
