<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d5aa7"/>
      <stop offset="100%" style="stop-color:#063366"/>
    </linearGradient>
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  
  <!-- Borde tricolor -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="white" stroke-width="2" stroke-dasharray="10,5,5,5" stroke-dashoffset="0"/>
  
  <!-- Urna simplificada -->
  <rect x="16" y="24" width="32" height="24" rx="3" fill="white"/>
  <rect x="14" y="22" width="36" height="6" rx="2" fill="white"/>
  <rect x="20" y="20" width="24" height="3" rx="1.5" fill="#063366"/>
  
  <!-- Check mark -->
  <path d="M24,34 L30,40 L42,28" fill="none" stroke="url(#check)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Puntos decorativos -->
  <circle cx="32" cy="8" r="2" fill="#FFD54F"/>
  <circle cx="32" cy="56" r="2" fill="#FFD54F"/>
  <circle cx="8" cy="32" r="2" fill="#FFD54F"/>
  <circle cx="56" cy="32" r="2" fill="#FFD54F"/>
</svg>
