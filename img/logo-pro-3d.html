<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTEPARD Logo 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0d1b2a;
    }
    
    .logo {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #0d1b2a 0%, #1b2838 100%);
      border-radius: 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 800px;
    }
    
    /* Círculo exterior */
    .circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 6px solid transparent;
      background: linear-gradient(#0d1b2a, #0d1b2a) padding-box,
                  linear-gradient(135deg, #1e88e5, #e53935, white, #1e88e5) border-box;
      box-shadow: 0 0 30px rgba(30, 136, 229, 0.4),
                  0 0 60px rgba(229, 57, 53, 0.3),
                  inset 0 0 30px rgba(0, 0, 0, 0.5);
      animation: circleGlow 4s ease-in-out infinite;
    }
    
    @keyframes circleGlow {
      0%, 100% { box-shadow: 0 0 30px rgba(30, 136, 229, 0.4), 0 0 60px rgba(229, 57, 53, 0.3); }
      33% { box-shadow: 0 0 40px rgba(229, 57, 53, 0.5), 0 0 80px rgba(30, 136, 229, 0.4); }
      66% { box-shadow: 0 0 40px rgba(255, 255, 255, 0.5), 0 0 80px rgba(229, 57, 53, 0.4); }
    }
    
    /* Urna 3D */
    .urna-3d {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      width: 120px;
      height: 100px;
      transform-style: preserve-3d;
      animation: urnFloat 3s ease-in-out infinite;
    }
    
    @keyframes urnFloat {
      0%, 100% { transform: translate(-50%, -55%) rotateX(-5deg) rotateY(-10deg); }
      50% { transform: translate(-50%, -60%) rotateX(-5deg) rotateY(-10deg); }
    }
    
    .urna-face {
      position: absolute;
      background: white;
      border: 1px solid #ddd;
    }
    
    .urna-front {
      width: 100px;
      height: 75px;
      left: 10px;
      top: 25px;
      transform: translateZ(15px);
      border-radius: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    
    .urna-right {
      width: 30px;
      height: 75px;
      right: -5px;
      top: 25px;
      transform: rotateY(90deg) translateZ(10px);
      background: linear-gradient(90deg, #f0f0f0 0%, #e0e0e0 100%);
      border-radius: 0 4px 4px 0;
    }
    
    .urna-top {
      width: 100px;
      height: 30px;
      left: 10px;
      top: 0;
      transform: rotateX(90deg) translateZ(10px);
      background: linear-gradient(180deg, #f8f8f8 0%, #f0f0f0 100%);
      border-radius: 4px 4px 0 0;
    }
    
    .borde-top {
      position: absolute;
      top: -5px;
      left: 5px;
      width: 110px;
      height: 12px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 3px;
      transform: translateZ(18px);
    }
    
    .ranura {
      position: absolute;
      top: -2px;
      left: 50%;
      transform: translateX(-50%) translateZ(20px);
      width: 60px;
      height: 5px;
      background: #0d1b2a;
      border-radius: 2.5px;
    }
    
    .doc {
      position: absolute;
      top: -55px;
      left: 50%;
      transform: translateX(-50%) translateZ(25px) rotate(-12deg);
      width: 30px;
      height: 40px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 2px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      animation: docMove 4s ease-in-out infinite;
    }
    
    @keyframes docMove {
      0%, 100% { transform: translateX(-50%) translateZ(25px) rotate(-12deg); }
      50% { transform: translateX(-50%) translateZ(25px) rotate(-5deg) translateY(15px); }
    }
    
    .doc-line {
      position: absolute;
      left: 5px;
      right: 5px;
      height: 1.5px;
      background: #e0e0e0;
      border-radius: 1px;
    }
    
    .doc-line:nth-child(1) { top: 8px; }
    .doc-line:nth-child(2) { top: 14px; }
    .doc-line:nth-child(3) { top: 20px; width: 50%; }
    
    .check {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 30px;
      height: 15px;
      border-left: 4px solid #1e88e5;
      border-bottom: 4px solid #1e88e5;
      transform: translate(-50%, -30%) translateZ(20px) rotate(-45deg);
      filter: drop-shadow(0 0 5px rgba(30, 136, 229, 0.6));
      animation: checkPulse 2s ease-in-out infinite;
    }
    
    @keyframes checkPulse {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(30, 136, 229, 0.6)); }
      50% { filter: drop-shadow(0 0 15px rgba(30, 136, 229, 0.9)); }
    }
    
    /* Texto */
    .text {
      position: absolute;
      bottom: 40px;
      text-align: center;
    }
    
    .title {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-weight: 700;
      font-size: 42px;
      color: white;
      letter-spacing: 6px;
      text-shadow: 0 0 20px rgba(30, 136, 229, 0.5);
    }
    
    .lines {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 12px 0;
    }
    
    .line {
      height: 3px;
      width: 50px;
      border-radius: 2px;
    }
    
    .line.blue { background: #1e88e5; }
    .line.white { background: white; }
    .line.red { background: #e53935; }
    
    .subtitle {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-weight: 300;
      font-size: 12px;
      color: #90CAF9;
      letter-spacing: 5px;
    }
  </style>
</head>
<body>
  <div class="logo">
    <!-- Círculo exterior -->
    <div class="circle"></div>
    
    <!-- Urna 3D -->
    <div class="urna-3d">
      <div class="urna-face urna-front"></div>
      <div class="urna-face urna-right"></div>
      <div class="urna-face urna-top"></div>
      <div class="borde-top"></div>
      <div class="ranura"></div>
      <div class="doc">
        <div class="doc-line"></div>
        <div class="doc-line"></div>
        <div class="doc-line"></div>
      </div>
      <div class="check"></div>
    </div>
    
    <!-- Texto -->
    <div class="text">
      <div class="title">SISTEPARD</div>
      <div class="lines">
        <div class="line blue"></div>
        <div class="line white"></div>
        <div class="line red"></div>
      </div>
      <div class="subtitle">SISTEMA ELECTORAL DIGITAL</div>
    </div>
  </div>
</body>
</html>
