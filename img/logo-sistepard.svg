<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gradiente azul -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0055A5"/>
      <stop offset="100%" style="stop-color:#003d7a"/>
    </linearGradient>
    <!-- Gradiente rojo -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8102E"/>
      <stop offset="100%" style="stop-color:#8B0000"/>
    </linearGradient>
    <!-- Sombra -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <!-- Brillo -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:white;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo circular blanco -->
  <circle cx="100" cy="100" r="95" fill="white" filter="url(#shadow)"/>
  
  <!-- Borde exterior tricolor -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#0055A5" stroke-width="4"/>
  <path d="M 100 8 A 92 92 0 0 1 184.9 54" fill="none" stroke="#C8102E" stroke-width="4"/>
  <path d="M 184.9 54 A 92 92 0 0 1 184.9 146" fill="none" stroke="#0055A5" stroke-width="4"/>
  <path d="M 184.9 146 A 92 92 0 0 1 100 192" fill="none" stroke="#C8102E" stroke-width="4"/>
  <path d="M 100 192 A 92 92 0 0 1 15.1 146" fill="none" stroke="#0055A5" stroke-width="4"/>
  <path d="M 15.1 146 A 92 92 0 0 1 15.1 54" fill="none" stroke="#C8102E" stroke-width="4"/>
  <path d="M 15.1 54 A 92 92 0 0 1 100 8" fill="none" stroke="#0055A5" stroke-width="4"/>
  
  <!-- Urna electoral 3D estilizada -->
  <g transform="translate(100, 105)">
    <!-- Cuerpo de la urna (caja 3D) -->
    <path d="M-35,-25 L35,-25 L40,-20 L40,25 L-40,25 L-40,-20 Z" fill="url(#blueGrad)" stroke="#003d7a" stroke-width="2"/>
    
    <!-- Lado derecho de la urna (profundidad) -->
    <path d="M35,-25 L45,-30 L45,20 L40,25 Z" fill="#003d7a" stroke="#002a5a" stroke-width="1"/>
    
    <!-- Superficie superior de la urna -->
    <path d="M-35,-25 L-25,-30 L45,-30 L35,-25 Z" fill="#0066cc" stroke="#003d7a" stroke-width="1"/>
    
    <!-- Ranura para el voto -->
    <rect x="-25" y="-28" width="50" height="4" rx="2" fill="#001a3d"/>
    
    <!-- Papel de voto entrando (dinámico, inclinado) -->
    <g transform="rotate(-15, 0, -30)">
      <rect x="-12" y="-50" width="24" height="35" rx="2" fill="white" stroke="#ddd" stroke-width="1"/>
      <!-- Check mark en el voto -->
      <path d="M-6,-38 L-2,-34 L8,-44" fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Líneas decorativas en el papel -->
      <line x1="-8" y1="-30" x2="8" y2="-30" stroke="#eee" stroke-width="1"/>
      <line x1="-8" y1="-26" x2="5" y2="-26" stroke="#eee" stroke-width="1"/>
    </g>
    
    <!-- Brillo metálico -->
    <path d="M-35,-25 L-25,-30 L-20,-30 L-30,-25 Z" fill="url(#shine)"/>
  </g>
  
  <!-- Texto SISTEPARD -->
  <text x="100" y="165" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="16" fill="#003d7a" letter-spacing="2">SISTEPARD</text>
  
  <!-- Línea decorativa tricolor debajo del texto -->
  <line x1="40" y1="172" x2="80" y2="172" stroke="#0055A5" stroke-width="3" stroke-linecap="round"/>
  <line x1="85" y1="172" x2="115" y2="172" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="172" x2="160" y2="172" stroke="#C8102E" stroke-width="3" stroke-linecap="round"/>
</svg>
