<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTEPARD Logo Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0d1b2a;
    }
    
    .logo {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #0d1b2a 0%, #1b2838 100%);
      border-radius: 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    /* Círculo exterior */
    .circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 6px solid transparent;
      background: linear-gradient(#0d1b2a, #0d1b2a) padding-box,
                  linear-gradient(135deg, #1e88e5, #e53935, white, #1e88e5) border-box;
      box-shadow: 0 0 30px rgba(30, 136, 229, 0.3),
                  0 0 60px rgba(229, 57, 53, 0.2),
                  inset 0 0 30px rgba(0, 0, 0, 0.5);
    }
    
    /* Urna */
    .urna {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      width: 100px;
      height: 75px;
      z-index: 2;
    }
    
    .urna-body {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 75px;
      background: linear-gradient(180deg, #ffffff 0%, #f5f5f5 100%);
      border: 1px solid #ddd;
      border-radius: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    
    .urna-top {
      position: absolute;
      top: -8px;
      left: -5px;
      width: 110px;
      height: 12px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 3px;
    }
    
    .ranura {
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 5px;
      background: #0d1b2a;
      border-radius: 2.5px;
    }
    
    .doc {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%) rotate(-12deg);
      width: 30px;
      height: 40px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 2px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }
    
    .doc-line {
      position: absolute;
      left: 5px;
      right: 5px;
      height: 1.5px;
      background: #e0e0e0;
      border-radius: 1px;
    }
    
    .doc-line:nth-child(1) { top: 8px; }
    .doc-line:nth-child(2) { top: 14px; }
    .doc-line:nth-child(3) { top: 20px; width: 50%; }
    
    .check {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -30%);
      width: 30px;
      height: 15px;
      border-left: 4px solid #1e88e5;
      border-bottom: 4px solid #1e88e5;
      transform: translate(-50%, -30%) rotate(-45deg);
      filter: drop-shadow(0 0 3px rgba(30, 136, 229, 0.5));
    }
    
    /* Texto */
    .text {
      position: absolute;
      bottom: 40px;
      text-align: center;
    }
    
    .title {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-weight: 700;
      font-size: 42px;
      color: white;
      letter-spacing: 6px;
    }
    
    .lines {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 12px 0;
    }
    
    .line {
      height: 3px;
      width: 50px;
      border-radius: 2px;
    }
    
    .line.blue { background: #1e88e5; }
    .line.white { background: white; }
    .line.red { background: #e53935; }
    
    .subtitle {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-weight: 300;
      font-size: 12px;
      color: #90CAF9;
      letter-spacing: 5px;
    }
  </style>
</head>
<body>
  <div class="logo">
    <!-- Círculo exterior -->
    <div class="circle"></div>
    
    <!-- Urna -->
    <div class="urna">
      <div class="urna-body"></div>
      <div class="urna-top"></div>
      <div class="ranura"></div>
      <div class="doc">
        <div class="doc-line"></div>
        <div class="doc-line"></div>
        <div class="doc-line"></div>
      </div>
      <div class="check"></div>
    </div>
    
    <!-- Texto -->
    <div class="text">
      <div class="title">SISTEPARD</div>
      <div class="lines">
        <div class="line blue"></div>
        <div class="line white"></div>
        <div class="line red"></div>
      </div>
      <div class="subtitle">SISTEMA ELECTORAL DIGITAL</div>
    </div>
  </div>
</body>
</html>
