<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0055A5"/>
      <stop offset="100%" style="stop-color:#003d7a"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)"/>
  
  <!-- Urna simplificada -->
  <rect x="8" y="12" width="16" height="12" rx="2" fill="white"/>
  <rect x="6" y="10" width="20" height="4" rx="1" fill="white"/>
  
  <!-- Ranura -->
  <rect x="11" y="9" width="10" height="2" rx="1" fill="#003d7a"/>
  
  <!-- Check mark -->
  <path d="M12,17 L15,20 L21,14" fill="none" stroke="#C8102E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Borde tricolor -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#C8102E" stroke-width="1.5" stroke-dasharray="8,8" stroke-dashoffset="4"/>
</svg>
