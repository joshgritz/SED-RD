<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTEPARD Logo 3D Urn</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0d1b2a;
    }
    
    .logo {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #0d1b2a 0%, #1b2838 100%);
      border-radius: 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 800px;
    }
    
    /* Anillo orbital */
    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220px;
      height: 60px;
      transform: translate(-50%, -55%) rotateX(70deg);
      transform-style: preserve-3d;
      animation: orbitSpin 8s linear infinite;
    }
    
    @keyframes orbitSpin {
      from { transform: translate(-50%, -55%) rotateX(70deg) rotateZ(0deg); }
      to { transform: translate(-50%, -55%) rotateX(70deg) rotateZ(360deg); }
    }
    
    .orbit-seg {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 4px solid transparent;
      border-radius: 50%;
    }
    
    .orbit-blue { border-top-color: #1e88e5; border-right-color: #1e88e5; }
    .orbit-red { border-bottom-color: #e53935; border-left-color: #e53935; transform: rotate(120deg); }
    .orbit-white { border-top-color: white; border-right-color: white; transform: rotate(240deg); }
    
    /* Urna 3D */
    .urna-3d {
      position: relative;
      width: 120px;
      height: 100px;
      transform-style: preserve-3d;
      transform: rotateX(-10deg) rotateY(-15deg);
      animation: urnFloat 3s ease-in-out infinite;
    }
    
    @keyframes urnFloat {
      0%, 100% { transform: rotateX(-10deg) rotateY(-15deg) translateY(0); }
      50% { transform: rotateX(-10deg) rotateY(-15deg) translateY(-8px); }
    }
    
    .urna-face {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
    }
    
    .urna-front {
      width: 100px;
      height: 80px;
      left: 10px;
      top: 20px;
      transform: translateZ(20px);
      border-radius: 3px;
    }
    
    .urna-right {
      width: 40px;
      height: 80px;
      right: -10px;
      top: 20px;
      transform: rotateY(90deg) translateZ(10px);
      background: linear-gradient(90deg, #e0e0e0 0%, #d0d0d0 100%);
      border-radius: 0 3px 3px 0;
    }
    
    .urna-top {
      width: 100px;
      height: 40px;
      left: 10px;
      top: -20px;
      transform: rotateX(90deg) translateZ(10px);
      background: linear-gradient(180deg, #f8f8f8 0%, #e8e8e8 100%);
      border-radius: 3px 3px 0 0;
    }
    
    /* Ranura */
    .ranura {
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%) translateZ(25px);
      width: 60px;
      height: 6px;
      background: #0d1b2a;
      border-radius: 3px;
    }
    
    /* Check en el frente */
    .check-urna {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -30%) translateZ(25px);
      width: 30px;
      height: 15px;
      border-left: 4px solid #1e88e5;
      border-bottom: 4px solid #1e88e5;
      transform: translate(-50%, -30%) translateZ(25px) rotate(-45deg);
    }
    
    /* Documento */
    .doc {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%) rotate(-15deg) translateZ(30px);
      width: 40px;
      height: 50px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 3px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      animation: docMove 4s ease-in-out infinite;
    }
    
    @keyframes docMove {
      0%, 100% { transform: translateX(-50%) rotate(-15deg) translateZ(30px); }
      50% { transform: translateX(-50%) rotate(-8deg) translateZ(30px) translateY(10px); }
    }
    
    .doc-line {
      position: absolute;
      left: 7px;
      right: 7px;
      height: 2px;
      background: #e0e0e0;
      border-radius: 1px;
    }
    
    .doc-line:nth-child(1) { top: 10px; }
    .doc-line:nth-child(2) { top: 18px; }
    .doc-line:nth-child(3) { top: 26px; width: 50%; }
    
    /* Texto */
    .text {
      position: absolute;
      bottom: 40px;
      text-align: center;
    }
    
    .title {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-weight: 700;
      font-size: 42px;
      color: white;
      letter-spacing: 6px;
    }
    
    .lines {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 12px 0;
    }
    
    .line {
      height: 3px;
      width: 50px;
      border-radius: 2px;
    }
    
    .line.blue { background: #1e88e5; }
    .line.white { background: white; }
    .line.red { background: #e53935; }
    
    .subtitle {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-weight: 300;
      font-size: 12px;
      color: #90CAF9;
      letter-spacing: 5px;
    }
  </style>
</head>
<body>
  <div class="logo">
    <!-- Anillo orbital -->
    <div class="orbit">
      <div class="orbit-seg orbit-blue"></div>
      <div class="orbit-seg orbit-red"></div>
      <div class="orbit-seg orbit-white"></div>
    </div>
    
    <!-- Urna 3D -->
    <div class="urna-3d">
      <div class="urna-face urna-front"></div>
      <div class="urna-face urna-right"></div>
      <div class="urna-face urna-top"></div>
      <div class="ranura"></div>
      <div class="check-urna"></div>
      <div class="doc">
        <div class="doc-line"></div>
        <div class="doc-line"></div>
        <div class="doc-line"></div>
      </div>
    </div>
    
    <!-- Texto -->
    <div class="text">
      <div class="title">SISTEPARD</div>
      <div class="lines">
        <div class="line blue"></div>
        <div class="line white"></div>
        <div class="line red"></div>
      </div>
      <div class="subtitle">SISTEMA ELECTORAL DIGITAL</div>
    </div>
  </div>
</body>
</html>
