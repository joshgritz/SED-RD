<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTEPARD Logo 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a1628 0%, #1a2744 100%);
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
    }
    
    .logo-container {
      position: relative;
      width: 400px;
      height: 400px;
      perspective: 1000px;
    }
    
    .logo-3d {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: rotate3d 8s ease-in-out infinite;
    }
    
    @keyframes rotate3d {
      0%, 100% { transform: rotateY(-15deg) rotateX(5deg); }
      50% { transform: rotateY(15deg) rotateX(-5deg); }
    }
    
    .circle-outer {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300px;
      height: 300px;
      transform: translate(-50%, -55%);
      border-radius: 50%;
      border: 4px solid transparent;
      background: linear-gradient(#0a1628, #0a1628) padding-box,
                  linear-gradient(135deg, #2196F3, #E53935, white, #2196F3) border-box;
      animation: borderGlow 4s linear infinite;
      box-shadow: 0 0 30px rgba(33, 150, 243, 0.3),
                  0 0 60px rgba(229, 57, 53, 0.2),
                  inset 0 0 30px rgba(0, 0, 0, 0.5);
    }
    
    @keyframes borderGlow {
      0% { box-shadow: 0 0 30px rgba(33, 150, 243, 0.5), 0 0 60px rgba(33, 150, 243, 0.3); }
      33% { box-shadow: 0 0 30px rgba(229, 57, 53, 0.5), 0 0 60px rgba(229, 57, 53, 0.3); }
      66% { box-shadow: 0 0 30px rgba(255, 255, 255, 0.5), 0 0 60px rgba(255, 255, 255, 0.3); }
      100% { box-shadow: 0 0 30px rgba(33, 150, 243, 0.5), 0 0 60px rgba(33, 150, 243, 0.3); }
    }
    
    .urna {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      width: 140px;
      height: 100px;
      transform-style: preserve-3d;
    }
    
    .urna-face {
      position: absolute;
      background: linear-gradient(180deg, #2196F3 0%, #1565C0 50%, #0D47A1 100%);
      border: 2px solid #0a4a8a;
    }
    
    .urna-front {
      width: 140px;
      height: 100px;
      transform: translateZ(20px);
      border-radius: 8px;
    }
    
    .urna-top {
      width: 140px;
      height: 40px;
      transform: rotateX(90deg) translateZ(20px);
      background: linear-gradient(180deg, #42A5F5 0%, #2196F3 100%);
      border-radius: 8px 8px 0 0;
    }
    
    .urna-right {
      width: 40px;
      height: 100px;
      transform: rotateY(90deg) translateZ(70px) translateX(-20px);
      background: linear-gradient(180deg, #1976D2 0%, #0D47A1 100%);
      border-radius: 0 8px 8px 0;
    }
    
    .ranura {
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%) translateZ(25px);
      width: 80px;
      height: 8px;
      background: #041a33;
      border-radius: 4px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
    
    .papel {
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%) translateZ(30px) rotate(-20deg);
      width: 50px;
      height: 70px;
      background: white;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      animation: papelMove 4s ease-in-out infinite;
    }
    
    @keyframes papelMove {
      0%, 100% { transform: translateX(-50%) translateZ(30px) rotate(-20deg) translateY(0); }
      50% { transform: translateX(-50%) translateZ(30px) rotate(-10deg) translateY(15px); }
    }
    
    .papel::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 8px;
      right: 8px;
      height: 3px;
      background: #e0e0e0;
      border-radius: 2px;
      box-shadow: 0 8px 0 #e0e0e0, 0 16px 0 #e0e0e0;
    }
    
    .check {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 12px;
      border-left: 3px solid #2E7D32;
      border-bottom: 3px solid #2E7D32;
      transform: translateX(-50%) rotate(-45deg);
      animation: checkPulse 2s ease-in-out infinite;
    }
    
    @keyframes checkPulse {
      0%, 100% { filter: drop-shadow(0 0 3px #4CAF50); }
      50% { filter: drop-shadow(0 0 10px #4CAF50) drop-shadow(0 0 20px #4CAF50); }
    }
    
    .text-container {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }
    
    .title {
      font-size: 36px;
      font-weight: 200;
      color: white;
      letter-spacing: 10px;
      text-shadow: 0 0 20px rgba(33, 150, 243, 0.5),
                   0 0 40px rgba(33, 150, 243, 0.3);
      animation: textGlow 3s ease-in-out infinite;
    }
    
    @keyframes textGlow {
      0%, 100% { text-shadow: 0 0 20px rgba(33, 150, 243, 0.5), 0 0 40px rgba(33, 150, 243, 0.3); }
      50% { text-shadow: 0 0 30px rgba(33, 150, 243, 0.8), 0 0 60px rgba(33, 150, 243, 0.5); }
    }
    
    .subtitle {
      font-size: 12px;
      font-weight: 300;
      color: #90CAF9;
      letter-spacing: 4px;
      margin-top: 10px;
      opacity: 0.8;
    }
    
    .line-gold {
      width: 200px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #FFD54F, transparent);
      margin: 10px auto;
      animation: linePulse 3s ease-in-out infinite;
    }
    
    @keyframes linePulse {
      0%, 100% { width: 200px; opacity: 0.8; }
      50% { width: 160px; opacity: 1; }
    }
    
    /* Partículas */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }
    
    .particle:nth-child(1) { background: #2196F3; left: 10%; animation-delay: 0s; }
    .particle:nth-child(2) { background: #E53935; left: 20%; animation-delay: 1s; }
    .particle:nth-child(3) { background: white; left: 30%; animation-delay: 2s; }
    .particle:nth-child(4) { background: #FFD54F; left: 40%; animation-delay: 0.5s; }
    .particle:nth-child(5) { background: #2196F3; left: 50%; animation-delay: 1.5s; }
    .particle:nth-child(6) { background: #E53935; left: 60%; animation-delay: 2.5s; }
    .particle:nth-child(7) { background: white; left: 70%; animation-delay: 0.3s; }
    .particle:nth-child(8) { background: #FFD54F; left: 80%; animation-delay: 1.8s; }
    .particle:nth-child(9) { background: #2196F3; left: 90%; animation-delay: 0.7s; }
    
    @keyframes float {
      0%, 100% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100vh) scale(1); opacity: 0; }
    }
    
    /* Instrucciones */
    .instructions {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
  
  <div class="logo-container">
    <div class="logo-3d">
      <div class="circle-outer"></div>
      
      <div class="urna">
        <div class="urna-face urna-front"></div>
        <div class="urna-face urna-top"></div>
        <div class="urna-face urna-right"></div>
        <div class="ranura"></div>
        
        <div class="papel">
          <div class="check"></div>
        </div>
      </div>
    </div>
    
    <div class="text-container">
      <div class="title">SISTEPARD</div>
      <div class="line-gold"></div>
      <div class="subtitle">SISTEMA ELECTORAL DIGITAL</div>
    </div>
  </div>
  
  <div class="instructions">
    Presiona F12 → Console → screenshot() para capturar
  </div>
</body>
</html>
