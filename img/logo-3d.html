<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTEPARD Logo 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a1628 0%, #1a2744 100%);
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
    }
    
    .logo-container {
      position: relative;
      width: 400px;
      height: 400px;
      perspective: 1000px;
    }
    
    .logo-3d {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: rotate3d 8s ease-in-out infinite;
    }
    
    @keyframes rotate3d {
      0%, 100% { transform: rotateY(-15deg) rotateX(5deg); }
      50% { transform: rotateY(15deg) rotateX(-5deg); }
    }
    
    .circle-outer {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 280px;
      height: 280px;
      transform: translate(-50%, -55%);
      border-radius: 50%;
      border: 4px solid transparent;
      background: linear-gradient(#0a1628, #0a1628) padding-box,
                  linear-gradient(135deg, #2196F3, #E53935, white, #2196F3) border-box;
      animation: borderGlow 4s linear infinite;
      box-shadow: 0 0 30px rgba(33, 150, 243, 0.3),
                  0 0 60px rgba(229, 57, 53, 0.2),
                  inset 0 0 30px rgba(0, 0, 0, 0.5);
    }
    
    @keyframes borderGlow {
      0% { box-shadow: 0 0 30px rgba(33, 150, 243, 0.5), 0 0 60px rgba(33, 150, 243, 0.3); }
      33% { box-shadow: 0 0 30px rgba(229, 57, 53, 0.5), 0 0 60px rgba(229, 57, 53, 0.3); }
      66% { box-shadow: 0 0 30px rgba(255, 255, 255, 0.5), 0 0 60px rgba(255, 255, 255, 0.3); }
      100% { box-shadow: 0 0 30px rgba(33, 150, 243, 0.5), 0 0 60px rgba(33, 150, 243, 0.3); }
    }
    
    /* Urna del v2 */
    .urna-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      width: 180px;
      height: 140px;
      transform-style: preserve-3d;
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translate(-50%, -60%); }
      50% { transform: translate(-50%, -65%); }
    }
    
    /* Cuerpo de la urna */
    .urna-body {
      position: absolute;
      bottom: 0;
      left: 10px;
      width: 140px;
      height: 100px;
      background: linear-gradient(180deg, #2196F3 0%, #1976D2 30%, #1565C0 70%, #0D47A1 100%);
      border: 2px solid #0a4a8a;
      border-radius: 4px;
      transform: translateZ(20px);
    }
    
    /* Lado derecho */
    .urna-right {
      position: absolute;
      bottom: 0;
      right: -15px;
      width: 35px;
      height: 100px;
      background: linear-gradient(180deg, #1976D2 0%, #0D47A1 100%);
      border: 2px solid #0a4a8a;
      border-left: none;
      border-radius: 0 4px 4px 0;
      transform: rotateY(70deg) translateZ(10px);
    }
    
    /* Superficie superior */
    .urna-top {
      position: absolute;
      top: -15px;
      left: 10px;
      width: 140px;
      height: 30px;
      background: linear-gradient(180deg, #42A5F5 0%, #2196F3 100%);
      border: 2px solid #0a4a8a;
      border-radius: 4px 4px 0 0;
      transform: rotateX(70deg) translateZ(10px);
    }
    
    /* Reflejos metálicos */
    .urna-body::before {
      content: '';
      position: absolute;
      top: 5px;
      left: 5px;
      width: 20px;
      height: 80%;
      background: linear-gradient(90deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
      border-radius: 4px;
    }
    
    .urna-body::after {
      content: '';
      position: absolute;
      top: 5px;
      left: 35px;
      width: 10px;
      height: 60%;
      background: linear-gradient(90deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
      border-radius: 4px;
    }
    
    /* Ranura */
    .ranura {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%) translateZ(25px);
      width: 80px;
      height: 8px;
      background: #041a33;
      border-radius: 4px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
    
    /* Líneas decorativas */
    .linea-deco {
      position: absolute;
      left: 15px;
      width: 130px;
      height: 1px;
      background: #42A5F5;
      opacity: 0.4;
      transform: translateZ(22px);
    }
    
    .linea-deco:nth-child(1) { bottom: 70px; }
    .linea-deco:nth-child(2) { bottom: 40px; }
    .linea-deco:nth-child(3) { bottom: 10px; }
    
    /* Papel del v2 */
    .papel {
      position: absolute;
      top: -95px;
      left: 50%;
      transform: translateX(-50%) translateZ(30px) rotate(-20deg);
      width: 50px;
      height: 65px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 3px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      animation: papelMove 4s ease-in-out infinite;
    }
    
    @keyframes papelMove {
      0%, 100% { transform: translateX(-50%) translateZ(30px) rotate(-20deg); }
      50% { transform: translateX(-50%) translateZ(30px) rotate(-12deg) translateY(12px); }
    }
    
    /* Líneas del papel */
    .papel-line {
      position: absolute;
      left: 8px;
      right: 8px;
      height: 2px;
      background: #e0e0e0;
      border-radius: 1px;
    }
    
    .papel-line:nth-child(1) { top: 12px; }
    .papel-line:nth-child(2) { top: 20px; }
    .papel-line:nth-child(3) { top: 28px; width: 60%; }
    
    /* Check mark del v2 */
    .check {
      position: absolute;
      top: 38px;
      left: 12px;
      width: 22px;
      height: 12px;
      border-left: 3.5px solid #2E7D32;
      border-bottom: 3.5px solid #2E7D32;
      transform: rotate(-45deg);
      animation: checkPulse 2s ease-in-out infinite;
    }
    
    @keyframes checkPulse {
      0%, 100% { filter: drop-shadow(0 0 2px #4CAF50); }
      50% { filter: drop-shadow(0 0 8px #4CAF50) drop-shadow(0 0 15px #4CAF50); }
    }
    
    /* Brillo superior */
    .shine {
      position: absolute;
      top: -5px;
      left: 15px;
      right: 15px;
      height: 15px;
      background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
      border-radius: 4px 4px 0 0;
      transform: translateZ(23px);
    }
    
    /* Texto */
    .text-container {
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }
    
    .title {
      font-size: 36px;
      font-weight: 200;
      color: white;
      letter-spacing: 10px;
      text-shadow: 0 0 20px rgba(33, 150, 243, 0.5),
                   0 0 40px rgba(33, 150, 243, 0.3);
      animation: textGlow 3s ease-in-out infinite;
    }
    
    @keyframes textGlow {
      0%, 100% { text-shadow: 0 0 20px rgba(33, 150, 243, 0.5), 0 0 40px rgba(33, 150, 243, 0.3); }
      50% { text-shadow: 0 0 30px rgba(33, 150, 243, 0.8), 0 0 60px rgba(33, 150, 243, 0.5); }
    }
    
    .subtitle {
      font-size: 12px;
      font-weight: 300;
      color: #90CAF9;
      letter-spacing: 4px;
      margin-top: 8px;
      opacity: 0.8;
    }
    
    .line-gold {
      width: 200px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #FFD54F, transparent);
      margin: 10px auto;
      animation: linePulse 3s ease-in-out infinite;
    }
    
    @keyframes linePulse {
      0%, 100% { width: 200px; opacity: 0.8; }
      50% { width: 160px; opacity: 1; }
    }
    
    /* Partículas */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      animation: float-particle 6s ease-in-out infinite;
    }
    
    .particle:nth-child(1) { background: #2196F3; left: 10%; animation-delay: 0s; }
    .particle:nth-child(2) { background: #E53935; left: 20%; animation-delay: 1s; }
    .particle:nth-child(3) { background: white; left: 30%; animation-delay: 2s; }
    .particle:nth-child(4) { background: #FFD54F; left: 40%; animation-delay: 0.5s; }
    .particle:nth-child(5) { background: #2196F3; left: 50%; animation-delay: 1.5s; }
    .particle:nth-child(6) { background: #E53935; left: 60%; animation-delay: 2.5s; }
    .particle:nth-child(7) { background: white; left: 70%; animation-delay: 0.3s; }
    .particle:nth-child(8) { background: #FFD54F; left: 80%; animation-delay: 1.8s; }
    .particle:nth-child(9) { background: #2196F3; left: 90%; animation-delay: 0.7s; }
    
    @keyframes float-particle {
      0%, 100% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100vh) scale(1); opacity: 0; }
    }
    
    .instructions {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
  
  <div class="logo-container">
    <div class="logo-3d">
      <div class="circle-outer"></div>
      
      <div class="urna-container">
        <div class="urna-body"></div>
        <div class="urna-right"></div>
        <div class="urna-top"></div>
        <div class="ranura"></div>
        <div class="linea-deco"></div>
        <div class="linea-deco"></div>
        <div class="linea-deco"></div>
        <div class="shine"></div>
        
        <div class="papel">
          <div class="papel-line"></div>
          <div class="papel-line"></div>
          <div class="papel-line"></div>
          <div class="check"></div>
        </div>
      </div>
    </div>
    
    <div class="text-container">
      <div class="title">SISTEPARD</div>
      <div class="line-gold"></div>
      <div class="subtitle">SISTEMA ELECTORAL DIGITAL</div>
    </div>
  </div>
  
  <div class="instructions">
    Presiona F12 → Console → screenshot() para capturar
  </div>
</body>
</html>
