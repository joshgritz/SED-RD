<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#1b2838"/>
    </linearGradient>
    
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5"/>
      <stop offset="50%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
    
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
    
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.4"/>
    </filter>
    
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="400" height="400" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Círculo exterior tricolor -->
  <circle cx="200" cy="175" r="130" fill="none" stroke="url(#circleGrad)" stroke-width="6" filter="url(#shadow)"/>
  
  <!-- Segmentos de color -->
  <path d="M200,45 A130,130 0 0,1 312,110" fill="none" stroke="#1e88e5" stroke-width="6" stroke-linecap="round"/>
  <path d="M312,110 A130,130 0 0,1 312,240" fill="none" stroke="#e53935" stroke-width="6" stroke-linecap="round"/>
  <path d="M312,240 A130,130 0 0,1 200,305" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <path d="M200,305 A130,130 0 0,1 88,240" fill="none" stroke="#1e88e5" stroke-width="6" stroke-linecap="round"/>
  <path d="M88,240 A130,130 0 0,1 88,110" fill="none" stroke="#e53935" stroke-width="6" stroke-linecap="round"/>
  <path d="M88,110 A130,130 0 0,1 200,45" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Urna realista -->
  <g transform="translate(200,175)" filter="url(#shadow)">
    <!-- Sombra de la urna -->
    <ellipse cx="0" cy="65" rx="55" ry="8" fill="black" opacity="0.3"/>
    
    <!-- Cuerpo principal -->
    <rect x="-50" y="-20" width="100" height="75" rx="4" fill="url(#boxGrad)" stroke="#ddd" stroke-width="1"/>
    
    <!-- Borde superior -->
    <rect x="-55" y="-28" width="110" height="12" rx="3" fill="white" stroke="#ddd" stroke-width="1"/>
    
    <!-- Ranura -->
    <rect x="-30" y="-25" width="60" height="6" rx="3" fill="#0d1b2a"/>
    
    <!-- Documento entrando -->
    <g transform="rotate(-12, 0, -35)">
      <rect x="-15" y="-65" width="30" height="40" rx="2" fill="white" stroke="#ddd" stroke-width="1"/>
      <line x1="-8" y1="-55" x2="8" y2="-55" stroke="#e0e0e0" stroke-width="1.5"/>
      <line x1="-8" y1="-48" x2="8" y2="-48" stroke="#e0e0e0" stroke-width="1.5"/>
      <line x1="-8" y1="-41" x2="3" y2="-41" stroke="#e0e0e0" stroke-width="1.5"/>
    </g>
    
    <!-- Check mark -->
    <path d="M-15,10 L-5,22 L20,-5" fill="none" stroke="url(#checkGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#innerGlow)"/>
  </g>
  
  <!-- Texto SISTEPARD -->
  <text x="200" y="310" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="42" fill="white" letter-spacing="6">SISTEPARD</text>
  
  <!-- Línea tricolor -->
  <line x1="80" y1="330" x2="160" y2="330" stroke="#1e88e5" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="330" x2="230" y2="330" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="330" x2="320" y2="330" stroke="#e53935" stroke-width="3" stroke-linecap="round"/>
  
  <text x="200" y="355" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="300" font-size="13" fill="#90CAF9" letter-spacing="5">SISTEMA ELECTORAL DIGITAL</text>
</svg>
