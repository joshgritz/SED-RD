<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="95"/>
    </clipPath>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="95" fill="#0d1b2a"/>
  
  <!-- Borde tricolor -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#1e88e5" stroke-width="3"/>
  <path d="M100,8 A92,92 0 0,1 179,54" fill="none" stroke="#e53935" stroke-width="3" stroke-linecap="round"/>
  <path d="M179,54 A92,92 0 0,1 179,146" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M179,146 A92,92 0 0,1 100,192" fill="none" stroke="#1e88e5" stroke-width="3" stroke-linecap="round"/>
  <path d="M100,192 A92,92 0 0,1 21,146" fill="none" stroke="#e53935" stroke-width="3" stroke-linecap="round"/>
  <path d="M21,146 A92,92 0 0,1 21,54" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M21,54 A92,92 0 0,1 100,8" fill="none" stroke="#1e88e5" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Urna -->
  <g transform="translate(100,95)">
    <!-- Sombra -->
    <ellipse cx="0" cy="45" rx="35" ry="5" fill="black" opacity="0.3"/>
    
    <!-- Cuerpo -->
    <rect x="-32" y="-12" width="64" height="50" rx="3" fill="white" stroke="#ddd" stroke-width="1"/>
    
    <!-- Borde superior -->
    <rect x="-36" y="-18" width="72" height="8" rx="2" fill="white" stroke="#ddd" stroke-width="1"/>
    
    <!-- Ranura -->
    <rect x="-20" y="-16" width="40" height="4" rx="2" fill="#0d1b2a"/>
    
    <!-- Documento -->
    <g transform="rotate(-12, 0, -25)">
      <rect x="-10" y="-45" width="20" height="28" rx="2" fill="white" stroke="#ddd" stroke-width="1"/>
      <line x1="-6" y1="-38" x2="6" y2="-38" stroke="#e0e0e0" stroke-width="1"/>
      <line x1="-6" y1="-33" x2="6" y2="-33" stroke="#e0e0e0" stroke-width="1"/>
      <line x1="-6" y1="-28" x2="2" y2="-28" stroke="#e0e0e0" stroke-width="1"/>
    </g>
    
    <!-- Check -->
    <path d="M-10,8 L-2,18 L14,-4" fill="none" stroke="#1e88e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Texto -->
  <text x="100" y="165" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14" fill="white" letter-spacing="2">SISTEPARD</text>
</svg>
