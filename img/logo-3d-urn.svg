<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#1b2838"/>
    </linearGradient>
    
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8e8e8"/>
    </linearGradient>
    
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d0d0d0"/>
      <stop offset="100%" style="stop-color:#b0b0b0"/>
    </linearGradient>
    
    <linearGradient id="boxTop" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#f0f0f0"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="400" height="400" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Anillo orbital giratorio -->
  <g transform="translate(200,170)">
    <ellipse cx="0" cy="0" rx="110" ry="30" fill="none" stroke="#1e88e5" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="110" ry="30" fill="none" stroke="#e53935" stroke-width="4" stroke-linecap="round" opacity="0.8" stroke-dasharray="30,60">
      <animateTransform attributeName="transform" type="rotate" from="120 0 0" to="480 0 0" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="110" ry="30" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8" stroke-dasharray="30,60">
      <animateTransform attributeName="transform" type="rotate" from="240 0 0" to="600 0 0" dur="8s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Urna 3D -->
  <g transform="translate(200,175)" filter="url(#shadow)">
    <!-- Sombra -->
    <ellipse cx="0" cy="70" rx="60" ry="10" fill="black" opacity="0.3"/>
    
    <!-- Lateral derecho -->
    <path d="M50,-30 L75,-45 L75,40 L50,55 Z" fill="url(#boxSide)" stroke="#a0a0a0" stroke-width="1"/>
    
    <!-- Superficie superior -->
    <path d="M-50,-30 L-25,-45 L75,-45 L50,-30 Z" fill="url(#boxTop)" stroke="#a0a0a0" stroke-width="1"/>
    
    <!-- Frente de la urna -->
    <rect x="-50" y="-30" width="100" height="85" rx="3" fill="url(#boxFront)" stroke="#a0a0a0" stroke-width="1"/>
    
    <!-- Ranura -->
    <rect x="-30" y="-38" width="60" height="8" rx="4" fill="#0d1b2a"/>
    
    <!-- Check en el frente -->
    <path d="M-15,5 L-5,18 L20,-8" fill="none" stroke="#1e88e5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Documento entrando -->
    <g transform="rotate(-15, 0, -50)">
      <rect x="-18" y="-85" width="36" height="45" rx="2" fill="white" stroke="#ddd" stroke-width="1"/>
      <line x1="-10" y1="-73" x2="10" y2="-73" stroke="#e0e0e0" stroke-width="2"/>
      <line x1="-10" y1="-65" x2="10" y2="-65" stroke="#e0e0e0" stroke-width="2"/>
      <line x1="-10" y1="-57" x2="5" y2="-57" stroke="#e0e0e0" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Texto SISTEPARD -->
  <g transform="translate(200,320)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="42" fill="white" letter-spacing="6">SISTEPARD</text>
    
    <!-- Línea tricolor -->
    <line x1="-120" y1="20" x2="-40" y2="20" stroke="#1e88e5" stroke-width="3" stroke-linecap="round"/>
    <line x1="-30" y1="20" x2="30" y2="20" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="20" x2="120" y2="20" stroke="#e53935" stroke-width="3" stroke-linecap="round"/>
    
    <text x="0" y="45" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="300" font-size="13" fill="#90CAF9" letter-spacing="5">SISTEMA ELECTORAL DIGITAL</text>
  </g>
</svg>
