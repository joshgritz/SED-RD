<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2744"/>
    </linearGradient>
    
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
    
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#0a3d7c"/>
    </linearGradient>
    
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e53935"/>
      <stop offset="100%" style="stop-color:#b71c1c"/>
    </linearGradient>
    
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F"/>
      <stop offset="50%" style="stop-color:#FFC107"/>
      <stop offset="100%" style="stop-color:#FF8F00"/>
    </linearGradient>
    
    <linearGradient id="digitalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bcd4"/>
      <stop offset="100%" style="stop-color:#0097a7"/>
    </linearGradient>
    
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:white;stop-opacity:0"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
    
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  
  <!-- Patrón digital sutil (circuitos) -->
  <g opacity="0.08" stroke="#00bcd4" stroke-width="1" fill="none">
    <path d="M50,100 L100,100 L100,150"/>
    <path d="M400,100 L450,100 L450,150"/>
    <path d="M50,400 L100,400 L100,350"/>
    <path d="M400,400 L450,400 L450,350"/>
    <circle cx="100" cy="150" r="3" fill="#00bcd4"/>
    <circle cx="450" cy="150" r="3" fill="#00bcd4"/>
    <circle cx="100" cy="350" r="3" fill="#00bcd4"/>
    <circle cx="450" cy="350" r="3" fill="#00bcd4"/>
    <path d="M200,50 L200,100 L250,100"/>
    <path d="M300,50 L300,100 L250,100"/>
    <path d="M200,450 L200,400 L250,400"/>
    <path d="M300,450 L300,400 L250,400"/>
  </g>
  
  <!-- Escudo hexagonal exterior (seguridad/confianza) -->
  <g transform="translate(250,230)" filter="url(#shadow)">
    <path d="M0,-140 L121,-70 L121,70 L0,140 L-121,70 L-121,-70 Z" 
          fill="url(#shieldGrad)" stroke="#1565c0" stroke-width="3"/>
    
    <!-- Brillo del escudo -->
    <path d="M0,-140 L121,-70 L60,-35 L0,-70 L-60,-35 L-121,-70 Z" 
          fill="url(#shine)" opacity="0.3"/>
    
    <!-- Escudo interior -->
    <path d="M0,-115 L97,-58 L97,58 L0,115 L-97,58 L-97,-58 Z" 
          fill="url(#shieldInner)" stroke="#0d47a1" stroke-width="2"/>
  </g>
  
  <!-- Anillo orbital que gira alrededor de la urna -->
  <g transform="translate(250,230)">
    <ellipse cx="0" cy="0" rx="85" ry="25" fill="none" stroke="url(#digitalGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="85" ry="25" fill="none" stroke="url(#redAccent)" stroke-width="3" stroke-linecap="round" opacity="0.8" stroke-dasharray="20,40">
      <animateTransform attributeName="transform" type="rotate" from="120 0 0" to="480 0 0" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="85" ry="25" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8" stroke-dasharray="20,40">
      <animateTransform attributeName="transform" type="rotate" from="240 0 0" to="600 0 0" dur="8s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Puntos de luz en el anillo -->
  <g transform="translate(250,230)">
    <circle r="5" fill="#00bcd4" filter="url(#glow)">
      <animateMotion dur="8s" repeatCount="indefinite">
        <mpath href="#orbitPath"/>
      </animateMotion>
    </circle>
    <circle r="4" fill="#e53935" filter="url(#glow)">
      <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0.33;0.33" keyTimes="0;1">
        <mpath href="#orbitPath"/>
      </animateMotion>
    </circle>
    <circle r="4" fill="white" filter="url(#glow)">
      <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0.66;0.66" keyTimes="0;1">
        <mpath href="#orbitPath"/>
      </animateMotion>
    </circle>
  </g>
  
  <path id="orbitPath" d="M250,230 m-85,0 a85,25 0 1,1 170,0 a85,25 0 1,1 -170,0" fill="none"/>
  
  <!-- Urna electoral moderna -->
  <g transform="translate(250,235)">
    <!-- Sombra de la urna -->
    <ellipse cx="0" cy="70" rx="60" ry="10" fill="black" opacity="0.3"/>
    
    <!-- Cuerpo de la urna -->
    <path d="M-50,-35 L50,-35 L58,-28 L58,45 L-58,45 L-58,-28 Z" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
    
    <!-- Lateral derecho -->
    <path d="M50,-35 L70,-48 L70,32 L58,45 Z" fill="#0d47a1" stroke="#0a3d7c" stroke-width="1"/>
    
    <!-- Superficie superior -->
    <path d="M-50,-35 L-30,-48 L70,-48 L50,-35 Z" fill="#42a5f5" stroke="#1e88e5" stroke-width="1"/>
    
    <!-- Reflejos metálicos -->
    <path d="M-50,-35 L-42,-43 L-38,-43 L-46,-35 Z" fill="white" opacity="0.5"/>
    <path d="M-25,-35 L-17,-43 L-13,-43 L-21,-35 Z" fill="white" opacity="0.3"/>
    
    <!-- Ranura digital -->
    <rect x="-35" y="-52" width="70" height="6" rx="3" fill="#041a33"/>
    <rect x="-33" y="-51" width="66" height="3" rx="1.5" fill="#0a2a4d"/>
    
    <!-- Indicadores LED -->
    <circle cx="-25" cy="-49" r="2" fill="#00e676">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-15" cy="-49" r="2" fill="#00e676">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="-5" cy="-49" r="2" fill="#00e676">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    
    <!-- Líneas decorativas -->
    <line x1="-45" y1="-15" x2="45" y2="-15" stroke="#42a5f5" stroke-width="1" opacity="0.4"/>
    <line x1="-45" y1="10" x2="45" y2="10" stroke="#42a5f5" stroke-width="1" opacity="0.4"/>
    <line x1="-45" y1="35" x2="45" y2="35" stroke="#42a5f5" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Papel de voto digital -->
  <g transform="translate(250,235)">
    <animateTransform attributeName="transform" type="rotate" values="-20,0,-52;-10,0,-52;-20,0,-52" dur="4s" repeatCount="indefinite" additive="sum"/>
    
    <!-- Sombra -->
    <rect x="-15" y="-100" width="38" height="55" rx="2" fill="black" opacity="0.3" transform="translate(3,3)"/>
    
    <!-- Papel -->
    <rect x="-15" y="-100" width="38" height="55" rx="2" fill="white" stroke="#ddd" stroke-width="1"/>
    
    <!-- Líneas del papel -->
    <line x1="-8" y1="-88" x2="15" y2="-88" stroke="#e0e0e0" stroke-width="1.5"/>
    <line x1="-8" y1="-80" x2="15" y2="-80" stroke="#e0e0e0" stroke-width="1.5"/>
    <line x1="-8" y1="-72" x2="8" y2="-72" stroke="#e0e0e0" stroke-width="1.5"/>
    
    <!-- Check mark digital -->
    <path d="M-5,-92 L0,-86 L8,-95" fill="none" stroke="url(#checkGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <animate attributeName="stroke-width" values="3.5;4.5;3.5" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Texto SISTEPARD -->
  <g transform="translate(250,380)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="48" fill="white" letter-spacing="8" filter="url(#glow)">SISTEPARD</text>
    
    <!-- Línea decorativa tricolor -->
    <line x1="-140" y1="20" x2="-50" y2="20" stroke="#1e88e5" stroke-width="3" stroke-linecap="round"/>
    <line x1="-40" y1="20" x2="40" y2="20" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="20" x2="140" y2="20" stroke="#e53935" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Subtítulo -->
    <text x="0" y="45" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="14" fill="#90CAF9" letter-spacing="6">SISTEMA ELECTORAL DIGITAL</text>
  </g>
  
  <!-- Elementos decorativos -->
  <g opacity="0.5">
    <!-- Esquinas -->
    <path d="M30,30 L30,60 M30,30 L60,30" fill="none" stroke="#1e88e5" stroke-width="2" stroke-linecap="round"/>
    <path d="M470,30 L470,60 M470,30 L440,30" fill="none" stroke="#e53935" stroke-width="2" stroke-linecap="round"/>
    <path d="M30,470 L30,440 M30,470 L60,470" fill="none" stroke="#e53935" stroke-width="2" stroke-linecap="round"/>
    <path d="M470,470 L470,440 M470,470 L440,470" fill="none" stroke="#1e88e5" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Puntos dorados -->
    <circle cx="45" cy="45" r="3" fill="#FFD54F"/>
    <circle cx="455" cy="45" r="3" fill="#FFD54F"/>
    <circle cx="45" cy="455" r="3" fill="#FFD54F"/>
    <circle cx="455" cy="455" r="3" fill="#FFD54F"/>
  </g>
</svg>
